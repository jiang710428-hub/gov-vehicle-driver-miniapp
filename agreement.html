<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 用户协议</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-deep: #001645;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --bg: #F9F9F9;
    --card: #FFFFFF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px;
    color: var(--text);
    overflow-y: auto;
  }

  .phone {
    width: 375px;
    max-width: 100%;
    height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative;
    overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .agree-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column;
    overflow-y: auto; scrollbar-width: none;
  }
  .agree-content::-webkit-scrollbar { display: none; }
  .agree-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid #EEF0F5;
  }
  .agree-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .agree-nav .back-btn:active { transform: scale(0.9); }
  .agree-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }
  .agree-body { flex: 1; padding: 0 20px; }
  .agree-empty {
    margin-top: 96px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .empty-icon {
    width: 88px; height: 88px; border-radius: 26px; background: #F4F6FA;
    display: flex; align-items: center; justify-content: center; margin-bottom: 8px;
  }
  .agree-empty p { font-size: 14px; color: #8A94A6; font-weight: 500; letter-spacing: .5px; }
  .agree-empty span { font-size: 12px; color: #B0B8C4; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="page" id="page-agreement">
    <div class="statusbar">
      <span class="time">9:41</span>
      <div class="capsule"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>

    <div class="agree-content">
      <div class="agree-nav">
        <button class="back-btn" onclick="location.href='index.html'">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3.5L5.5 9l5.5 5.5" stroke="#0A1628" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="title">用户协议</span>
      </div>
      <div class="agree-body">
        <div class="agree-empty">
          <div class="empty-icon">
            <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
              <rect x="8" y="5" width="28" height="34" rx="4" stroke="#C3CCDA" stroke-width="2"/>
              <path d="M15 14h14M15 20h14M15 26h9" stroke="#C3CCDA" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <p>协议内容整理中…</p>
          <span>上线前将在此处补充完整条款</span>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
