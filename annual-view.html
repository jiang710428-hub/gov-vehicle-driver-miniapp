<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 年检信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --red: #EF4444;
    --red-dark: #DC2626;
    --red-bg: #FEF2F2;
    --amber: #D97706;
    --amber-bg: #FFFBEB;
    --bg: #F7F8FA;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .iv-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* 导航栏 */
  .iv-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .iv-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .iv-nav .back-btn:active { transform: scale(0.9); }
  .iv-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }

  .iv-body {
    flex: 1; overflow-y: auto; scrollbar-width: none;
    padding: 14px 16px 26px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .iv-body::-webkit-scrollbar { display: none; }

  /* 车辆上下文条 */
  .ctx-card {
    display: flex; align-items: center; gap: 11px;
    background: #fff; border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .ctx-card .ctx-plate {
    width: 104px; height: 36px; border-radius: 9px; flex-shrink: 0;
    background: #0A1628; color: #fff;
    font-size: 13px; font-weight: 800; letter-spacing: 1.4px;
    display: flex; align-items: center; justify-content: center;
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
  }
  .ctx-card .ctx-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .ctx-card .ctx-t {
    font-size: 13.5px; font-weight: 800;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-card .ctx-s {
    font-size: 10.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ctx-tag {
    flex-shrink: 0; align-self: flex-start;
    font-size: 10.5px; font-weight: 700; border-radius: 100px; padding: 3px 9px;
    display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .ctx-tag::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .9; }
  .ctx-tag.ok   { color: var(--green-dark); background: var(--green-bg); }
  .ctx-tag.warn { color: var(--amber);      background: var(--amber-bg); }
  .ctx-tag.hot  { color: var(--red-dark);   background: var(--red-bg); }
  .ctx-tag.exp  { color: var(--red-dark);   background: var(--red-bg); }

  /* 卡片 */
  .f-card {
    background: #fff; border-radius: 16px; padding: 14px 15px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .f-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .f-head .no {
    width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .f-head .t { font-size: 14.5px; font-weight: 800; letter-spacing: .3px; }
  .f-head .sub { margin-left: auto; font-size: 10px; color: var(--faint); flex-shrink: 0; }

  /* 信息行 */
  .r-row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 2px; }
  .r-row + .r-row { border-top: 1px solid var(--line); }
  .r-row .rk { width: 76px; flex-shrink: 0; font-size: 12px; color: var(--muted); line-height: 22px; }
  .r-row .rv {
    flex: 1; min-width: 0; text-align: right;
    font-size: 13.5px; font-weight: 700; line-height: 1.55;
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
    word-break: break-all;
  }
  .r-row .rv .it-ty {
    display: inline-block; vertical-align: 1px;
    font-size: 10px; font-weight: 700; color: var(--primary);
    background: var(--blue-bg); border-radius: 100px; padding: 2px 9px; letter-spacing: .3px;
  }
  .r-row .rv .due-st {
    display: inline-block; margin-left: 6px; vertical-align: 1px;
    font-size: 9.5px; font-weight: 700; border-radius: 100px; padding: 2px 8px;
    letter-spacing: .3px;
  }
  .due-st.ok   { color: var(--green-dark); background: var(--green-bg); }
  .due-st.warn { color: var(--amber);      background: var(--amber-bg); }
  .due-st.hot  { color: var(--red-dark);   background: var(--red-bg); }
  .due-st.exp  { color: var(--red-dark);   background: var(--red-bg); }

  /* 附件照片网格（只读） */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-cell {
    aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; position: relative;
    background: #F0F2F7; cursor: zoom-in;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .photo-cell:active { transform: scale(0.96); }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cell .idx {
    position: absolute; right: 5px; bottom: 5px;
    background: rgba(10, 22, 40, .68); color: #fff;
    font-size: 9.5px; font-weight: 700; border-radius: 100px; padding: 1px 7px;
    font-family: Inter, sans-serif;
  }
  .photo-cell .zoom {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(10, 22, 40, 0); color: #fff;
    transition: background .18s;
  }
  .photo-cell:active .zoom { background: rgba(10, 22, 40, .24); }
  .photo-empty {
    grid-column: 1 / -1; aspect-ratio: auto; height: 120px; border-radius: 12px;
    background: #F5F7FA; border: 1.5px dashed #D8E0EA;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: var(--muted); font-size: 11.5px;
  }

  /* 空态（无年检信息） */
  .iv-empty {
    padding: 52px 20px; text-align: center; background: #fff;
    border-radius: 16px; box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .iv-empty .e-ic {
    width: 66px; height: 66px; margin: 0 auto 14px; border-radius: 21px;
    background: linear-gradient(135deg, #FDF3E3, #FAE9C8);
    display: flex; align-items: center; justify-content: center;
  }
  .iv-empty .e-t { font-size: 14px; font-weight: 700; color: var(--text); }
  .iv-empty .e-s { font-size: 11.5px; margin-top: 7px; color: var(--muted); line-height: 1.7; }

  /* ===== 大图预览 lightbox ===== */
  .lb-mask {
    position: absolute; inset: 0; background: rgba(5, 11, 22, .96);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 500;
    display: flex; align-items: center; justify-content: center;
  }
  .lb-mask.show { opacity: 1; pointer-events: auto; }
  .lb-mask img {
    max-width: 86%; max-height: 62%; border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
    object-fit: contain; background: #fff;
  }
  .lb-x {
    position: absolute; top: 58px; right: 22px; width: 34px; height: 34px;
    border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.14); color: #fff; font-size: 15px; line-height: 34px;
    text-align: center; padding: 0;
  }
  .lb-arr {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 38px; height: 56px; border-radius: 12px; border: none; cursor: pointer;
    background: rgba(255,255,255,.10); color: #fff; font-size: 20px; line-height: 56px;
    text-align: center; padding: 0; font-family: Inter, sans-serif;
  }
  .lb-arr.prev { left: 14px; }
  .lb-arr.next { right: 14px; }
  .lb-arr:disabled { opacity: .22; cursor: default; }
  .lb-idx {
    position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.9); font-size: 12.5px; font-weight: 600;
    background: rgba(255,255,255,.12); border-radius: 100px; padding: 4px 14px;
    font-family: Inter, sans-serif; letter-spacing: .5px; white-space: nowrap;
  }
  .lb-tip {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    color: rgba(255,255,255,.45); font-size: 10px; white-space: nowrap;
  }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(16px);
    background: rgba(10, 22, 40, .9); color: #fff;
    padding: 9px 18px; border-radius: 100px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 600;
    white-space: nowrap; max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="page">
      <div class="statusbar">
        <span class="time">10:24</span>
        <span class="capsule"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>

      <div class="iv-content">
        <div class="iv-nav">
          <button class="back-btn" onclick="goBack()" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="title">年检信息</span>
        </div>

        <div class="iv-body" id="wrap">
          <!-- 动态渲染 -->
        </div>
      </div>
    </div>

    <!-- 大图预览 -->
    <div class="lb-mask" id="lbMask" onclick="closeLb()">
      <button class="lb-x" onclick="event.stopPropagation();closeLb()" aria-label="关闭">✕</button>
      <button class="lb-arr prev" id="lbPrev" onclick="event.stopPropagation();lbNav(-1)" aria-label="上一张">‹</button>
      <img id="lbImg" alt="证件附件大图" onclick="event.stopPropagation()">
      <button class="lb-arr next" id="lbNext" onclick="event.stopPropagation();lbNav(1)" aria-label="下一张">›</button>
      <span class="lb-idx" id="lbIdx">1 / 1</span>
      <span class="lb-tip">点击空白处关闭</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var ANN_KEY = 'zp_annual_info';
  var rec = null;          /* 当前查看车辆的年检信息（每车一份，后台维护） */
  var photos = [];
  var lbI = 0;

  /* ========== 工具 ========== */
  function byId(id) { return document.getElementById(id); }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }
  /* 相对今天偏移 o 天的日期 YYYY-MM-DD（演示数据用，可为负） */
  function off(o) {
    var d = new Date();
    var t = new Date(d.getFullYear(), d.getMonth(), d.getDate() + o);
    return t.getFullYear() + '-' + p2(t.getMonth() + 1) + '-' + p2(t.getDate());
  }
  function annLoad() {
    try { var raw = localStorage.getItem(ANN_KEY); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function annSave(a) { localStorage.setItem(ANN_KEY, JSON.stringify(a)); }

  /* 证件附件占位图（A4 年检报告 / 合格标志扫描件示意） */
  function docImg(k) {
    var P = [
      { band: '#014DB2', line: '#C9D9F2' },
      { band: '#047857', line: '#BFE9D8' },
      { band: '#B45309', line: '#F3DFC2' }
    ];
    var c = P[k % 3];
    var rows = '';
    for (var i = 0; i < 5; i++) {
      var w = 150 + (i * 17) % 55;
      rows += "<rect x='92' y='" + (124 + i * 42) + "' width='" + w + "' height='8' rx='4' fill='" + c.line + "'/>" +
              "<rect x='26' y='" + (120 + i * 42) + "' width='56' height='16' rx='8' fill='" + c.band + "' opacity='.07'/>";
    }
    return 'data:image/svg+xml,' + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='440'>" +
      "<rect width='320' height='440' rx='14' fill='#fff'/>" +
      "<path d='M0 14a14 14 0 0 1 14-14h292a14 14 0 0 1 14 14v84H0z' fill='" + c.band + "'/>" +
      "<rect x='26' y='38' width='110' height='16' rx='8' fill='#fff' opacity='.95'/>" +
      "<rect x='26' y='64' width='170' height='9' rx='4.5' fill='#fff' opacity='.55'/>" +
      "<circle cx='258' cy='62' r='26' fill='#fff' opacity='.92'/>" +
      "<path d='M248 62l7 7 13-15' stroke='" + c.band + "' stroke-width='5' stroke-linecap='round' stroke-linejoin='round' fill='none'/>" +
      rows +
      "<circle cx='74' cy='352' r='30' fill='none' stroke='" + c.band + "' opacity='.35' stroke-width='2'/>" +
      "<path d='M64 352l7 7 12-14' stroke='" + c.band + "' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none' opacity='.85'/>" +
      "</svg>");
  }

  /* ========== 演示数据：与车辆列表 6 车对齐，每车一份年检信息 ========== */
  /* 到期日相对今天偏移（<90 天 / 已到期用于演示入口与卡片倒计时） */
  function annSeed() {
    if (annLoad().length) return;
    var S = [];
    function push(plate, inspectOff, expireOff, org, pics) {
      var arr = [];
      (pics || []).forEach(function (k) { arr.push(docImg(k)); });
      S.push({ plate: plate, inspectDate: off(inspectOff), expireDate: off(expireOff), org: org, photos: arr });
    }
    push('苏A·12345', -305, 60, '南京苏运机动车检测站', [0, 1]);
    push('苏A·23456', -215, 150, '南京蓝盾车辆检测中心', [2]);
    push('苏A·34567', -277, 88, '江苏盛达机动车检测有限公司', [1, 0]);
    push('苏A·67890', -368, -3, '南京浦口机动车检测站', [2]);
    push('苏A·54321', -335, 30, '南京车福机动车检测有限公司', [0]);
    push('苏A·88888', -165, 200, '南京苏运机动车检测站', [1, 2]);
    annSave(S);
  }

  function annOf(plate) {
    annSeed();
    var a = annLoad(), i;
    for (i = 0; i < a.length; i++) { if (a[i].plate === plate) return a[i]; }
    return null;
  }

  /* ===== 到期状态：>90 未到期 / ≤90 剩N天(≤30 红) / 已到期 ===== */
  function annSt(due) {
    var a = String(due).split('-');
    var d = new Date(+a[0], (+a[1] || 1) - 1, +a[2] || 1);
    var t = new Date(); t.setHours(0, 0, 0, 0);
    var days = Math.round((d - t) / 86400000);
    if (days < 0)  return { cls: 'exp',  txt: '已到期',  days: days };
    if (days <= 30) return { cls: 'hot',  txt: '剩 ' + days + ' 天', days: days };
    if (days <= 90) return { cls: 'warn', txt: '剩 ' + days + ' 天', days: days };
    return { cls: 'ok', txt: '未到期', days: days };
  }

  /* ========== toast ========== */
  var toastTimer = null;
  function toast(msg) {
    var el = byId('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  /* ========== 大图预览 ========== */
  function openPhoto(i) {
    if (!photos.length) return;
    lbI = i;
    renderLb();
    byId('lbMask').classList.add('show');
  }
  function lbNav(d) {
    if (photos.length < 2) return;
    lbI = (lbI + d + photos.length) % photos.length;
    renderLb();
  }
  function renderLb() {
    byId('lbImg').src = photos[lbI];
    byId('lbIdx').textContent = (lbI + 1) + ' / ' + photos.length;
    byId('lbPrev').disabled = photos.length < 2;
    byId('lbNext').disabled = photos.length < 2;
  }
  function closeLb() { byId('lbMask').classList.remove('show'); }

  /* ========== 渲染 ========== */
  function photosHtml(list) {
    if (!list.length) {
      return '<div class="photo-grid">' +
        '<div class="photo-empty">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 3.5h12A1.5 1.5 0 0 1 19.5 5v16l-3-1.6-3 1.6-3-1.6-3 1.6V5A1.5 1.5 0 0 1 6 3.5z" stroke="#A5AEBE" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.8 8.5h6.4M8.8 12h6.4" stroke="#A5AEBE" stroke-width="1.6" stroke-linecap="round"/></svg>' +
          '后台未上传证件附件' +
        '</div>' +
      '</div>';
    }
    var h = '<div class="photo-grid">';
    list.forEach(function (src, i) {
      h += '<div class="photo-cell" onclick="openPhoto(' + i + ')">' +
        '<img src="' + src + '" alt="证件附件' + (i + 1) + '">' +
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="zoom"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.4" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.4 4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.4 11h5.2M11 8.4v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>' +
      '</div>';
    });
    return h + '</div>';
  }

  function render() {
    var wrap = byId('wrap');
    if (!rec) {
      /* 该车暂无年检信息（后台未录入） */
      wrap.innerHTML =
        '<div class="iv-empty">' +
          '<div class="e-ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="16" rx="2.5" stroke="#B45309" stroke-width="1.8"/><path d="M8 3v4M16 3v4M3.5 10h17" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/><path d="M9.2 15.2l2.1 2.1 3.5-4" stroke="#B45309" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
          '<div class="e-t">该车暂无年检信息</div>' +
          '<div class="e-s">年检信息由后台管理台统一维护录入<br>录入后在此展示，驾驶员仅可查看</div>' +
        '</div>';
      return;
    }

    var st = annSt(rec.expireDate);
    photos = (rec.photos || []).slice();

    var rows =
      '<div class="r-row"><span class="rk">年检日期</span><span class="rv">' + esc(rec.inspectDate) + '</span></div>' +
      '<div class="r-row"><span class="rk">到期时间</span><span class="rv">' + esc(rec.expireDate) +
        '<span class="due-st ' + st.cls + '">' + st.txt + '</span></span></div>' +
      '<div class="r-row"><span class="rk">检验机构</span><span class="rv">' + esc(rec.org) + '</span></div>';

    wrap.innerHTML =
      /* 车辆上下文 + 到期倒计时标签 */
      '<div class="ctx-card">' +
        '<span class="ctx-plate">' + esc(rec.plate) + '</span>' +
        '<span class="ctx-m">' +
          '<span class="ctx-t">' + esc(rec.org) + '</span>' +
          '<span class="ctx-s">由后台管理台统一维护</span>' +
        '</span>' +
        '<span class="ctx-tag ' + st.cls + '">' + st.txt + '</span>' +
      '</div>' +
      /* ① 年检信息 */
      '<div class="f-card">' +
        '<div class="f-head"><span class="no">1</span><span class="t">年检信息</span></div>' +
        rows +
      '</div>' +
      /* ② 证件附件 */
      '<div class="f-card">' +
        '<div class="f-head"><span class="no">2</span><span class="t">证件附件</span>' +
          '<span class="sub">共 ' + photos.length + ' 张 · 点击查看大图</span></div>' +
        photosHtml(photos) +
      '</div>';
  }

  /* ========== 返回 ========== */
  function goBack() {
    /* 年检信息由车辆信息页「年检管理」进入（带 plate）→ 直接返回车辆信息页 */
    var plate = rec && rec.plate ? rec.plate : qs('plate');
    if (plate) { location.href = 'vehicle-detail.html?plate=' + encodeURIComponent(plate); return; }
    location.href = 'vehicles.html';
  }

  /* ========== 启动 ========== */
  (function init() {
    var plate = qs('plate');
    if (!plate) {
      toast('缺少车辆参数');
      setTimeout(function () { location.href = 'vehicles.html'; }, 900);
      return;
    }
    rec = annOf(plate);
    render();
  })();
</script>
</body>
</html>
