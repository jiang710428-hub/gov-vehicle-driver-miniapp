<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 出勤记录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --amber: #D97706;
    --amber-bg: #FFFBEB;
    --indigo: #4F46E5;
    --indigo-bg: #EEF0FF;
    --bg: #F7F8FA;
    --line: #EEF0F5;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .at-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* 导航栏 */
  .at-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .at-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .at-nav .back-btn:active { transform: scale(0.9); }
  .at-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }

  .at-body {
    flex: 1; overflow-y: auto; scrollbar-width: none;
    padding: 14px 16px 30px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .at-body::-webkit-scrollbar { display: none; }
  #dayList { display: flex; flex-direction: column; gap: 12px; }

  /* 每日卡片 */
  .day-card {
    background: #fff; border-radius: 16px; padding: 13px 15px 10px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .day-card.today { border-color: #BFD8F6; box-shadow: 0 8px 20px rgba(1, 77, 178, 0.12); }

  .d-head { display: flex; align-items: center; gap: 7px; padding-bottom: 2px; }
  .d-date { font-size: 15px; font-weight: 800; letter-spacing: .3px; }
  .d-week { font-size: 11px; color: var(--muted); }
  .d-pill {
    font-size: 10px; font-weight: 700; color: #fff; letter-spacing: .5px;
    background: linear-gradient(135deg, #0A5FD4, #014DB2);
    border-radius: 100px; padding: 2px 8px;
  }
  .d-stat {
    margin-left: auto; font-size: 10.5px; font-weight: 700; border-radius: 100px;
    padding: 3px 9px; border: 1px solid transparent;
  }
  .d-stat.ok { color: var(--green-dark); background: var(--green-bg); border-color: #A7F3D0; }
  .d-stat.warn { color: var(--amber); background: var(--amber-bg); border-color: #FDE68A; }
  .d-stat.indy { color: var(--indigo); background: var(--indigo-bg); border-color: #D8DCFA; }
  .d-stat.gray { color: var(--muted); background: #F3F5F9; border-color: #E5E9F1; }

  /* 卡位行（上班 / 下班 已记录） */
  .p-row {
    display: flex; align-items: center; gap: 9px;
    margin-top: 8px; padding: 9px 7px; border-radius: 12px; cursor: pointer;
    transition: background .15s;
  }
  .p-row:active { background: #F6F8FC; }
  .p-ic {
    width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .p-ic.am { background: linear-gradient(135deg, #EAF3FF 0%, #DCE9FC 100%); }
  .p-ic.pm { background: linear-gradient(135deg, #EEF0FF 0%, #E0E5FC 100%); }
  .p-name { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .p-time {
    font-size: 12px; color: var(--muted); letter-spacing: .4px;
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .p-tag {
    margin-left: auto; font-size: 10.5px; font-weight: 700; border-radius: 100px;
    padding: 3px 9px; border: 1px solid transparent; flex-shrink: 0;
  }
  .p-tag.normal { color: var(--green-dark); background: var(--green-bg); border-color: #A7F3D0; }
  .p-tag.leave { color: var(--amber); background: var(--amber-bg); border-color: #FDE68A; }
  .p-tag.off { color: var(--indigo); background: var(--indigo-bg); border-color: #D8DCFA; }
  .p-go { flex-shrink: 0; color: #C2C9D4; display: flex; }

  /* 空卡位（未记录 / 待打卡） */
  .p-row.miss { cursor: default; }
  .p-row.miss:active { background: transparent; }
  .p-row.miss .p-ic { background: #F1F3F7; }
  .p-row.miss .p-ic svg { stroke: #C4CCD8; }
  .p-row.miss .p-name { color: #B4BDCC; }
  .p-state {
    margin-left: auto; font-size: 12px; font-weight: 700; color: #C4CCD8;
    background: #F3F5F9; border-radius: 100px; padding: 3px 11px; flex-shrink: 0;
  }

  /* 脚注 */
  .foot-tip { text-align: center; font-size: 10.5px; color: var(--faint); line-height: 1.7; padding-top: 2px; }

  /* 新增出勤 FAB */
  .fab {
    position: absolute; right: 16px; bottom: 16px; z-index: 80;
    height: 48px; padding: 0 20px 0 16px; border: none; border-radius: 100px;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 14.5px; font-weight: 700; font-family: inherit;
    letter-spacing: .5px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 12px 26px rgba(1, 77, 178, 0.38);
    transition: transform .15s, box-shadow .2s;
  }
  .fab:active { transform: scale(0.95); box-shadow: 0 6px 14px rgba(1, 77, 178, 0.32); }
  .fab .f-ic {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
  }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(16px);
    background: rgba(10, 22, 40, .9); color: #fff;
    padding: 9px 18px; border-radius: 100px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 400;
    white-space: nowrap; max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="page">
      <div class="statusbar">
        <span class="time">09:52</span>
        <span class="capsule"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>

      <div class="at-content">
        <div class="at-nav">
          <button class="back-btn" onclick="location.href='my.html'" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="title">出勤记录</span>
        </div>

        <div class="at-body">
          <div id="dayList"></div>
          <div class="foot-tip">每天固定两次打卡：首次新增为「上班」，第二次为「下班」<br>正常出勤需上传本人自拍照，请假 / 调休可不传 · 历史出勤不可补记</div>
        </div>

        <!-- 新增出勤 -->
        <button type="button" class="fab" onclick="fabAdd()">
          <span class="f-ic">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg>
          </span>
          新增出勤
        </button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var KEY = 'zp_attendance_list';
  var LIST = load();
  var TYPE_TXT = { normal: '正常出勤', leave: '请假', off: '调休' };
  var LOC_ADDR = '江苏省南京市建邺区新城大道智慧新城中心大厦';

  /* ========== 工具 ========== */
  function byId(id) { return document.getElementById(id); }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function parseDate(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function weekText(d) { return '周' + '日一二三四五六'[d.getDay()]; }
  function today() { var d = new Date(); return dstr(d); }
  function fmtTime(d) {
    d = d || new Date();
    return p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
    catch (e) { return null; }
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(LIST)); }

  /* ========== 演示数据 ========== */
  function demoSelfie(k) {
    var cs = [
      { bg: '#EAF1FC', c1: '#014DB2' },
      { bg: '#ECFDF5', c1: '#047857' },
      { bg: '#FFFBEB', c1: '#D97706' }
    ];
    var c = cs[k % cs.length];
    var s = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'>" +
      "<rect width='320' height='320' rx='20' fill='" + c.bg + "'/>" +
      "<circle cx='160' cy='122' r='52' fill='" + c.c1 + "' opacity='.92'/>" +
      "<path d='M66 302c6-64 50-102 94-102s88 38 94 102z' fill='" + c.c1 + "' opacity='.92'/>" +
      "<rect x='104' y='238' width='112' height='22' rx='11' fill='#fff' opacity='.6'/>" +
      "</svg>";
    return 'data:image/svg+xml,' + encodeURIComponent(s);
  }

  function seed() {
    var d = new Date();
    var y = d.getFullYear(), m = d.getMonth() + 1, day = d.getDate();
    function off(o) { var t = new Date(y, m - 1, day + o); return dstr(t); }
    var yest = off(-1), td = off(0);
    LIST = [
      {
        id: 'A' + Date.now() + '1', date: yest, slot: 'am', type: 'normal',
        time: '08:12', selfie: demoSelfie(0), loc: LOC_ADDR, locTime: '08:12',
        photos: [], note: ''
      },
      {
        id: 'A' + Date.now() + '2', date: yest, slot: 'pm', type: 'normal',
        time: '17:46', selfie: demoSelfie(1), loc: LOC_ADDR, locTime: '17:46',
        photos: [], note: ''
      },
      {
        id: 'A' + Date.now() + '3', date: td, slot: 'am', type: 'normal',
        time: '08:30', selfie: demoSelfie(2), loc: LOC_ADDR, locTime: '08:30',
        photos: [], note: ''
      }
    ];
    save();
  }

  /* ========== 图标 ========== */
  var SVG_UP = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 19V5.5M6 11.5L12 5.5l6 6" stroke="#014DB2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var SVG_DOWN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v13.5M6 12.5l6 6 6-6" stroke="#4F46E5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var SVG_GO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /* ========== 单日状态徽章 ========== */
  function dayStat(a, p) {
    var n = (a ? 1 : 0) + (p ? 1 : 0);
    if (n === 0) return ['warn', '今日待打卡'];
    if (n === 1) return ['warn', '已记录 1/2'];
    if (a.type === p.type) {
      if (a.type === 'normal') return ['ok', '已出勤'];
      if (a.type === 'leave') return ['warn', '请假'];
      return ['indy', '调休'];
    }
    return ['gray', '已记录'];
  }

  /* ========== 行渲染 ========== */
  function recRow(r) {
    var isAm = r.slot === 'am';
    return '<div class="p-row" onclick="view(\'' + r.id + '\')">' +
      '<span class="p-ic ' + (isAm ? 'am' : 'pm') + '">' + (isAm ? SVG_UP : SVG_DOWN) + '</span>' +
      '<span class="p-name">' + (isAm ? '上班' : '下班') + '</span>' +
      '<span class="p-time">' + esc(r.time || '--:--') + '</span>' +
      '<span class="p-tag ' + r.type + '">' + TYPE_TXT[r.type] + '</span>' +
      '<span class="p-go">' + SVG_GO + '</span></div>';
  }
  /* 空卡位：今天=待打卡(引导新增)，历史=未记录(不可补记) */
  function missRow(dateStr, slot) {
    var isT = dateStr === today();
    return '<div class="p-row miss" onclick="missTap(' + (isT ? 'true' : 'false') + ')">' +
      '<span class="p-ic ' + slot + '">' + (slot === 'am' ? SVG_UP : SVG_DOWN) + '</span>' +
      '<span class="p-name">' + (slot === 'am' ? '上班' : '下班') + '</span>' +
      '<span class="p-state">' + (isT ? '待打卡' : '未记录') + '</span></div>';
  }

  function dayCard(dateStr, am, pm) {
    var d = parseDate(dateStr), isT = dateStr === today();
    var st = dayStat(am, pm);
    var rows = '';
    rows += am ? recRow(am) : missRow(dateStr, 'am');
    rows += pm ? recRow(pm) : missRow(dateStr, 'pm');
    return '<div class="day-card' + (isT ? ' today' : '') + '">' +
      '<div class="d-head">' +
      '<span class="d-date">' + (d.getMonth() + 1) + '月' + d.getDate() + '日</span>' +
      '<span class="d-week">' + weekText(d) + '</span>' +
      (isT ? '<span class="d-pill">今天</span>' : '') +
      '<span class="d-stat ' + st[0] + '">' + st[1] + '</span>' +
      '</div>' + rows + '</div>';
  }

  function render() {
    var tStr = today();
    var dates = [tStr];
    LIST.forEach(function (r) {
      if (dates.indexOf(r.date) < 0) dates.push(r.date);
    });
    dates.sort(function (a, b) { return a < b ? 1 : -1; });

    var h = '';
    dates.forEach(function (ds) {
      var am = null, pm = null;
      LIST.forEach(function (r) {
        if (r.date !== ds) return;
        if (r.slot === 'am') am = r;
        else if (r.slot === 'pm') pm = r;
      });
      h += dayCard(ds, am, pm);
    });
    byId('dayList').innerHTML = h;
  }

  /* ========== 操作 ========== */
  /* 点击已记录行：只读查看 */
  function view(id) { location.href = 'attendance-view.html?id=' + id; }
  /* 点击空卡位 */
  function missTap(isToday) {
    if (isToday) toast('今日尚未打卡，请点击右下角「新增出勤」');
    else toast('已过日期无法补记，仅可查看已有记录');
  }
  /* 新增出勤：每天首次=上班，第二次=下班 */
  function fabAdd() {
    var t = today();
    var am = false, pm = false;
    LIST.forEach(function (r) {
      if (r.date !== t) return;
      if (r.slot === 'am') am = true;
      else if (r.slot === 'pm') pm = true;
    });
    if (!am) { location.href = 'attendance-edit.html?slot=am'; return; }
    if (!pm) { location.href = 'attendance-edit.html?slot=pm'; return; }
    toast('今日「上班」「下班」均已打卡完成');
  }

  /* ========== toast ========== */
  var toastTimer = null;
  function toast(msg) {
    var el = byId('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  /* ========== 初始化 ========== */
  if (!LIST) seed();
  render();
</script>
</body>
</html>
