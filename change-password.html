<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 修改密码</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --bg: #F7F8FA;
    --line: #EEF0F5;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .cp-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* 导航栏 */
  .cp-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .cp-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .cp-nav .back-btn:active { transform: scale(0.9); }
  .cp-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }

  .cp-body {
    flex: 1; overflow-y: auto; scrollbar-width: none;
    padding: 16px 16px 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .cp-body::-webkit-scrollbar { display: none; }

  /* 主卡 */
  .cp-card {
    background: #fff; border-radius: 16px; padding: 18px 16px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .cp-title { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .cp-title svg { flex-shrink: 0; }
  .cp-desc { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

  /* 步骤进度 */
  .steps { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .steps .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--faint); white-space: nowrap; }
  .steps .st .no {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    background: #E9EDF3; color: #9AA5B5;
    font-size: 11px; font-weight: 800; font-style: normal;
    display: flex; align-items: center; justify-content: center;
    transition: all .25s;
  }
  .steps .st.on { color: var(--primary); }
  .steps .st.on .no { background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff; box-shadow: 0 3px 8px rgba(1,77,178,.3); }
  .steps .st.done { color: var(--green-dark); }
  .steps .st.done .no { background: var(--green); color: #fff; }
  .steps .bar { flex: 1; height: 3px; border-radius: 2px; background: #E9EDF3; overflow: hidden; }
  .steps .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #10B981, #0A5FD4); transition: width .4s; }
  .steps .bar.fill > i { width: 100%; }
  .steps .div { flex: 1; }

  /* 表单分组切换 */
  .cp-form { margin-top: 14px; }
  .cp-form.hide { display: none; }

  /* 验证通过提示条 */
  .verify-ok {
    display: flex; align-items: center; gap: 8px;
    background: var(--green-bg); border: 1px solid #A7F3D0; border-radius: 12px;
    padding: 10px 12px; color: var(--green-dark);
    font-size: 12.5px; font-weight: 600;
  }

  .form-field { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .form-label { font-size: 13px; font-weight: 600; color: var(--sub); padding-left: 4px; }
  .field {
    height: 52px; border-radius: 12px; background: #F5F7FA;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border: 1.5px solid transparent; transition: all .2s;
  }
  .field:focus-within {
    background: #fff; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(1,77,178,.12), 0 6px 18px rgba(1,77,178,.08);
  }
  .field:focus-within svg * { stroke: var(--primary); }
  .field:focus-within svg rect[fill="#8A94A6"],
  .field:focus-within svg circle[fill="#8A94A6"] { fill: var(--primary); }
  .field.bad { border-color: var(--red); background: #fff; }
  .field.bad:focus-within { box-shadow: 0 0 0 3px rgba(239,68,68,.1); }
  .field input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text); font-family: inherit; letter-spacing: .5px;
  }
  .field input::placeholder { color: var(--faint); }
  .field .eye-btn {
    border: none; background: transparent; cursor: pointer; display: flex;
    padding: 4px; flex-shrink: 0;
  }
  .err-msg {
    display: none; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--red); padding-left: 4px;
  }
  .err-msg.show { display: flex; }
  .rule-tip { font-size: 11px; color: var(--muted); padding-left: 4px; }

  /* 主按钮（与全站 submit-btn 规范统一：通栏渐变） */
  .next-btn {
    display: block; width: 100%;
    margin-top: 20px; height: 50px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    font-family: inherit;
    box-shadow: 0 10px 22px rgba(1, 77, 178, 0.32);
    transition: transform .15s, opacity .2s;
  }
  .next-btn:active { transform: scale(.98); }
  .next-btn:disabled { background: #C7CEDB; box-shadow: none; cursor: not-allowed; }

  /* 演示提示 */
  .demo-tip { text-align: center; font-size: 11px; color: var(--faint); line-height: 1.7; }

  /* toast */
  .toast {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 60px; z-index: 200;
    background: rgba(10,22,40,.88); color: #fff;
    font-size: 13px; padding: 10px 18px; border-radius: 100px;
    opacity: 0; pointer-events: none; transition: opacity .25s, bottom .25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; bottom: 76px; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="page">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span class="time">09:54</span>
      <div class="capsule">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>

    <div class="cp-content">
      <!-- 导航栏 -->
      <div class="cp-nav">
        <button class="back-btn" onclick="location.href='my.html'" aria-label="返回">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="title">修改密码</span>
      </div>

      <div class="cp-body">
        <div class="cp-card">
          <div class="cp-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="10" rx="2.6" stroke="#014DB2" stroke-width="1.7"/><path d="M8 10.5V7.6a4 4 0 018 0v2.9" stroke="#014DB2" stroke-width="1.7"/><circle cx="12" cy="15.3" r="1.6" fill="#014DB2"/></svg>
            重置登录密码
          </div>
          <div class="cp-desc">为保障账号安全，修改密码前需先验证当前登录密码</div>

          <!-- 步骤进度 -->
          <div class="steps">
            <span class="st on" id="st1"><span class="no" id="no1">1</span>验证当前密码</span>
            <span class="bar" id="stepBar"><i></i></span>
            <span class="st" id="st2"><span class="no" id="no2">2</span>设置新密码</span>
          </div>

          <!-- 阶段一：验证当前密码 -->
          <div class="cp-form" id="formStep1">
            <div class="form-field">
              <label class="form-label" for="pwdCur">当前密码</label>
              <div class="field" id="curField">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><rect x="10.6" y="5.4" width="2.8" height="5.6" rx="1.4" stroke="#8A94A6" stroke-width="1.6"/><circle cx="12" cy="15.2" r="1.5" fill="#8A94A6"/></svg>
                <input type="password" id="pwdCur" placeholder="请输入当前登录密码" autocomplete="off">
                <button type="button" class="eye-btn" onclick="togglePwd('pwdCur')">
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#8A94A6" stroke-width="1.6"/></svg>
                </button>
              </div>
              <span class="err-msg" id="curErr">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#EF4444" stroke-width="1.8"/><path d="M12 7.5v5" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.2" r="1.2" fill="#EF4444"/></svg>
                <span id="curErrTxt">当前密码不正确</span>
              </span>
            </div>
            <button class="next-btn" id="btnNext" onclick="verifyCur()">下一步</button>
          </div>

          <!-- 阶段二：设置新密码 -->
          <div class="cp-form hide" id="formStep2">
            <div class="verify-ok">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" fill="#10B981"/><path d="M7.5 12.4l3 3 6-6.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              当前密码验证通过，请设置新密码
            </div>

            <div class="form-field">
              <label class="form-label" for="pwdNew">新密码</label>
              <div class="field" id="newField">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><rect x="10.6" y="5.4" width="2.8" height="5.6" rx="1.4" stroke="#8A94A6" stroke-width="1.6"/><circle cx="12" cy="15.2" r="1.5" fill="#8A94A6"/></svg>
                <input type="password" id="pwdNew" placeholder="6-20 位，字母 + 数字" autocomplete="off">
                <button type="button" class="eye-btn" onclick="togglePwd('pwdNew')">
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#8A94A6" stroke-width="1.6"/></svg>
                </button>
              </div>
            </div>

            <div class="form-field">
              <label class="form-label" for="pwdNew2">确认新密码</label>
              <div class="field" id="new2Field">
                <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><rect x="10.6" y="5.4" width="2.8" height="5.6" rx="1.4" stroke="#8A94A6" stroke-width="1.6"/><circle cx="12" cy="15.2" r="1.5" fill="#8A94A6"/></svg>
                <input type="password" id="pwdNew2" placeholder="请再次输入新密码" autocomplete="off">
                <button type="button" class="eye-btn" onclick="togglePwd('pwdNew2')">
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#8A94A6" stroke-width="1.6"/></svg>
                </button>
              </div>
            </div>
            <div class="rule-tip">新密码须为 6-20 位，且同时包含字母和数字，不能与当前密码相同</div>

            <button class="next-btn" id="btnSave" onclick="savePwd()">确认修改</button>
          </div>
        </div>

        <div class="demo-tip">原型演示：当前初始密码为 <b style="font-weight:700;color:#6B7280">123456</b>，新密码建议 6-20 位字母+数字组合</div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
  /* 原型演示用当前密码 */
  var CUR_PWD = '123456';
  var curOk = false;

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  function togglePwd(id) {
    var inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function setErr(fieldId, errId, msg) {
    document.getElementById(fieldId).classList.add('bad');
    if (errId) {
      document.getElementById(errId + 'Txt').textContent = msg;
      document.getElementById(errId).classList.add('show');
    }
  }
  function clearErr(fieldId, errId) {
    var f = document.getElementById(fieldId);
    if (f) f.classList.remove('bad');
    if (errId) {
      var e = document.getElementById(errId);
      if (e) e.classList.remove('show');
    }
  }

  /* —— 阶段一：校验当前密码 —— */
  function verifyCur() {
    var v = document.getElementById('pwdCur').value;
    clearErr('curField', 'curErr');
    if (!v) { setErr('curField', 'curErr', '请输入当前密码'); toast('请输入当前密码'); return; }
    if (v !== CUR_PWD) {
      setErr('curField', 'curErr', '当前密码不正确，请重新输入');
      toast('当前密码不正确');
      return;
    }
    curOk = true;
    /* 进入阶段二 */
    document.getElementById('formStep1').classList.add('hide');
    document.getElementById('formStep2').classList.remove('hide');
    document.getElementById('no1').textContent = '✓';
    document.getElementById('st1').classList.remove('on');
    document.getElementById('st1').classList.add('done');
    document.getElementById('st2').classList.add('on');
    document.getElementById('stepBar').classList.add('fill');
    var body = document.querySelector('.cp-body');
    if (body) body.scrollTop = 0;
    toast('当前密码验证通过');
  }

  /* —— 阶段二：校验并保存新密码 —— */
  function savePwd() {
    var v1 = document.getElementById('pwdNew').value;
    var v2 = document.getElementById('pwdNew2').value;
    var pwRe = /^(?=.*[A-Za-z])(?=.*\d)\S{6,20}$/;

    clearErr('newField');
    clearErr('new2Field');

    if (!v1) { setErr('newField', null, ''); toast('请输入新密码'); return; }
    if (!pwRe.test(v1)) {
      setErr('newField', null, '');
      toast('新密码须为 6-20 位，且同时包含字母和数字');
      return;
    }
    if (v1 === CUR_PWD) {
      setErr('newField', null, '');
      toast('新密码不能与当前密码相同');
      return;
    }
    if (!v2) { setErr('new2Field', null, ''); toast('请再次输入新密码'); return; }
    if (v1 !== v2) {
      setErr('new2Field', null, '');
      toast('两次输入的新密码不一致');
      return;
    }
    var btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.textContent = '提交中…';
    setTimeout(function () {
      toast('密码修改成功');
      setTimeout(function () { location.href = 'my.html'; }, 1200);
    }, 600);
  }

  /* 输入时清除错误态 */
  ['pwdCur', 'pwdNew', 'pwdNew2'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      if (id === 'pwdCur') clearErr('curField', 'curErr');
      if (id === 'pwdNew') clearErr('newField');
      if (id === 'pwdNew2') clearErr('new2Field');
    });
  });
</script>

</body>
</html>
