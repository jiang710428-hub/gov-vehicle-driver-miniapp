<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 开始用车</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --amber: #F59E0B;
    --red: #EF4444;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px;
    color: var(--text);
    overflow-y: auto;
  }

  /* 手机外框 */
  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* 状态栏 */
  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  /* 内容 */
  .ck-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column;
    overflow-y: auto; scrollbar-width: none;
  }
  .ck-content::-webkit-scrollbar { display: none; }
  .ck-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid #EEF0F5;
  }
  .ck-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .ck-nav .back-btn:active { transform: scale(0.9); }
  .ck-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }
  .ck-body { flex: 1; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }

  /* 通用状态徽章 */
  .status-badge {
    font-size: 11.5px; font-weight: 600; border-radius: 100px; padding: 3px 9px;
    border: 1px solid transparent;
  }
  .status-badge.ok { color: var(--green-dark); background: var(--green-bg); border-color: #A7F3D0; }
  .status-badge.loading { color: var(--muted); background: #F3F4F6; border-color: #E5E7EB; }
  .status-badge.pending { color: var(--amber); background: #FFFBEB; border-color: #FDE68A; }

  /* 卡片公共 */
  .ck-card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
  }
  .card-head .h3 { font-size: 16px; font-weight: 700; }

  /* 左右分栏布局：左人脸识别，右GPS+现场照片 */
  .duo { display: flex; gap: 10px; align-items: stretch; }
  .duo-left { flex: 1.08; display: flex; min-width: 0; }
  .duo-right { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .duo .ck-card { padding: 13px 12px; display: flex; flex-direction: column; }
  .duo .card-head { margin-bottom: 10px; }
  .duo .card-head .h3 { font-size: 14px; }
  .duo .status-badge { font-size: 10.5px; padding: 2px 7px; }

  /* 步骤进度 */
  .step-head {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
  }
  .step-head .snum {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .step-head .stxt { flex: 1; min-width: 0; }
  .step-head .stxt .t { font-size: 14px; font-weight: 700; }
  .step-head .stxt .s { font-size: 11px; color: var(--muted); }
  .step-bar { width: 84px; height: 6px; border-radius: 3px; background: #E5EAF3; overflow: hidden; flex-shrink: 0; }
  .step-bar > span { display: block; height: 100%; width: 14%; border-radius: 3px; background: linear-gradient(90deg, #0A5FD4, #4C8DF0); }

  /* 人脸识别卡 */
  .face-ring {
    width: 128px; height: 128px; border-radius: 50%; margin: 0 auto 10px;
    background: #EAF1FA; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .15s;
    flex-shrink: 0;
  }
  .face-ring:active { transform: scale(.98); }
  .face-ring .corner {
    position: absolute; width: 22px; height: 22px;
    pointer-events: none;
  }
  .face-ring .corner.tl { top: 8px; left: 8px; }
  .face-ring .corner.tr { top: 8px; right: 8px; transform: scaleX(-1); }
  .face-ring .corner.bl { bottom: 8px; left: 8px; transform: scaleY(-1); }
  .face-ring .corner.br { bottom: 8px; right: 8px; transform: scale(-1, -1); }

  .face-ring .placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--faint);
  }
  .face-ring .placeholder .user-box {
    width: 48px; height: 48px; border-radius: 50%; background: #fff;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(15,42,86,.10);
  }
  .face-ring .placeholder .txt { font-size: 11.5px; font-weight: 600; color: var(--sub); }
  .face-ring .placeholder .tip { font-size: 10px; color: var(--faint); }
  .face-ring img {
    width: 100%; height: 100%; object-fit: cover; display: none;
  }

  .face-hint {
    text-align: center; font-size: 11.5px; color: #4B5563; margin-bottom: 12px;
  }

  .info-table {
    border-top: 1px solid var(--line); padding-top: 4px;
  }
  .info-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 0; font-size: 12px;
  }
  .info-row:not(:last-child) { border-bottom: 1px solid #F2F4F8; }
  .info-row .label { color: var(--sub); }
  .info-row .value { font-weight: 600; color: var(--text); }
  .info-row .value.green { color: var(--green); }

  .face-retake {
    text-align: center; margin-top: 10px; display: none;
  }
  .face-retake .link {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--primary); cursor: pointer;
    background: none; border: none;
  }
  .face-retake .link:active { opacity: .7; }

  /* GPS 定位卡（右侧上方，紧凑版） */
  .loc-body { display: flex; gap: 9px; }
  .loc-pin {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--blue-bg); display: flex; align-items: center; justify-content: center;
  }
  .loc-text { flex: 1; min-width: 0; }
  .loc-text .addr {
    font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.55;
    word-break: break-all;
  }
  .loc-text .time { font-size: 10.5px; color: var(--muted); margin-top: 5px; }

  /* 现场拍照卡（右侧下方，弹性填充） */
  .scene-shot {
    border-radius: 12px; height: 128px; background: #F0F2F7; overflow: hidden;
    position: relative; cursor: pointer; border: 1.5px dashed #CBD5E1;
    transition: border-color .2s, transform .15s;
  }
  .scene-shot:active { transform: scale(.99); }
  .scene-shot.has-photo { border-style: solid; border-color: var(--green); }
  .scene-shot .scene-placeholder {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
    color: var(--faint);
  }
  .scene-shot .scene-placeholder .cam-box {
    width: 46px; height: 46px; border-radius: 15px;
    background: linear-gradient(135deg, #EFF6FF, #DCECFB); border: 1px solid #D6E6FA;
    box-shadow: 0 4px 12px rgba(15,42,86,.10);
    display: flex; align-items: center; justify-content: center;
  }
  .scene-shot .scene-placeholder .txt { font-size: 11.5px; font-weight: 600; color: var(--sub); }
  .scene-shot .scene-placeholder .tip { font-size: 10px; color: var(--faint); }
  .scene-shot img { width: 100%; height: 100%; object-fit: cover; display: none; }

  .re-take-row { display: none; justify-content: center; margin-top: 10px; }
  .re-take-row.show { display: flex; }
  .re-take-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 13px; border-radius: 100px;
    border: 1px solid #D1D5DB; background: #fff; color: #374151;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: transform .15s;
  }
  .re-take-btn:active { transform: scale(.97); }

  /* 提交按钮 */
  .submit-btn {
    margin-top: 4px; height: 50px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    box-shadow: 0 10px 22px rgba(1, 77, 178, 0.32);
    transition: transform .15s, opacity .2s;
  }
  .submit-btn:active { transform: scale(.98); }
  .submit-btn:disabled {
    background: #C7CEDB; color: #fff; box-shadow: none; cursor: not-allowed;
  }
  .submit-tip { text-align: center; font-size: 11px; color: var(--muted); }

  /* toast */
  .toast {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 60px; z-index: 200;
    background: rgba(10,22,40,.88); color: #fff;
    font-size: 13px; padding: 10px 18px; border-radius: 100px;
    opacity: 0; pointer-events: none; transition: opacity .25s, bottom .25s;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; bottom: 76px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="page">
      <!-- 状态栏 -->
      <div class="statusbar">
        <span class="time">09:12</span>
        <span class="capsule">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
      </div>

      <div class="ck-content">
        <!-- 导航栏 -->
        <div class="ck-nav">
          <button class="back-btn" onclick="location.href='home.html'" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="title">开始用车</span>
        </div>

        <div class="ck-body">
          <!-- 步骤进度 -->
          <div class="step-head">
            <span class="snum">1</span>
            <div class="stxt">
              <div class="t">开始用车</div>
              <div class="s">第 1 步 · 共 7 步</div>
            </div>
            <div class="step-bar"><span></span></div>
          </div>

          <div class="duo">
            <!-- 左：人脸识别卡 -->
            <div class="duo-left">
              <div class="ck-card">
                <div class="card-head">
                  <span class="h3">人脸识别</span>
                  <span class="status-badge pending" id="faceStatus">待拍摄</span>
                </div>

                <div class="face-ring" id="shotSelfie" onclick="document.getElementById('fileSelfie').click()">
                  <svg class="corner tl" viewBox="0 0 26 26" fill="none"><path d="M5 2h12M5 2v10" stroke="#014DB2" stroke-width="2.4" stroke-linecap="round"/></svg>
                  <svg class="corner tr" viewBox="0 0 26 26" fill="none"><path d="M5 2h12M5 2v10" stroke="#014DB2" stroke-width="2.4" stroke-linecap="round"/></svg>
                  <svg class="corner bl" viewBox="0 0 26 26" fill="none"><path d="M5 2h12M5 2v10" stroke="#014DB2" stroke-width="2.4" stroke-linecap="round"/></svg>
                  <svg class="corner br" viewBox="0 0 26 26" fill="none"><path d="M5 2h12M5 2v10" stroke="#014DB2" stroke-width="2.4" stroke-linecap="round"/></svg>

                  <div class="placeholder" id="facePlaceholder">
                    <div class="user-box">
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="9" r="4.5" stroke="#014DB2" stroke-width="1.6"/><path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="#014DB2" stroke-width="1.6" stroke-linecap="round"/></svg>
                    </div>
                    <span class="txt">点击拍摄人脸</span>
                    <span class="tip">仅支持相机拍摄</span>
                  </div>
                  <img id="imgSelfie" alt="人脸识别照片">
                </div>

                <div class="face-hint">请保持正脸在识别框内</div>

                <div class="info-table">
                  <div class="info-row"><span class="label">姓名</span><span class="value">张三</span></div>
                  <div class="info-row"><span class="label">工号</span><span class="value">10086</span></div>
                </div>

                <div class="face-retake" id="faceRetake">
                  <button class="link" onclick="event.stopPropagation();resetShot('selfie')">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#014DB2" stroke-width="1.6"/></svg>
                    重新拍摄
                  </button>
                </div>
                <input type="file" id="fileSelfie" accept="image/*" capture="user" style="display:none" onchange="onPhoto(this, 'selfie')">
              </div>
            </div>

            <!-- 右：GPS定位（上） + 现场拍照（下） -->
            <div class="duo-right">
              <div class="ck-card">
                <div class="card-head">
                  <span class="h3">GPS定位</span>
                  <span class="status-badge loading" id="locStatus">定位中…</span>
                </div>
                <div class="loc-body">
                  <div class="loc-pin">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21s-6.5-5.2-6.5-10a6.5 6.5 0 1 1 13 0c0 4.8-6.5 10-6.5 10z" stroke="#014DB2" stroke-width="1.8"/><circle cx="12" cy="10.5" r="2.6" stroke="#014DB2" stroke-width="1.8"/></svg>
                  </div>
                  <div class="loc-text">
                    <div class="addr" id="locAddr">正在获取当前位置…</div>
                    <div class="time" id="locTime">--</div>
                  </div>
                </div>
              </div>

              <div class="ck-card">
                <div class="card-head">
                  <span class="h3">现场拍照</span>
                  <span class="status-badge pending" id="sceneStatus">待拍摄</span>
                </div>
                <div class="scene-shot" id="shotScene" onclick="document.getElementById('fileScene').click()">
                  <div class="scene-placeholder" id="scenePlaceholder">
                    <div class="cam-box">
                      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#014DB2" stroke-width="1.6"/></svg>
                    </div>
                    <span class="txt">点击拍摄现场照片</span>
                    <span class="tip">仅支持相机拍摄</span>
                  </div>
                  <img id="imgScene" alt="现场照片">
                </div>
                <div class="re-take-row" id="sceneRetake">
                  <button class="re-take-btn" onclick="event.stopPropagation();resetShot('scene')">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#374151" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#374151" stroke-width="1.6"/></svg>
                    重新拍照
                  </button>
                </div>
                <input type="file" id="fileScene" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this, 'scene')">
              </div>
            </div>
          </div>

          <!-- 提交 -->
          <button class="submit-btn" id="submitBtn" disabled onclick="submitCheckin()">提交报到</button>
          <div class="submit-tip">需完成人脸拍照、定位、现场拍照拍摄后方可提交</div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

<script>
  var photos = { selfie: null, scene: null };

  function fmtTime() {
    var now = new Date();
    var p = function (n) { return n < 10 ? '0' + n : n; };
    return now.getFullYear() + '-' + p(now.getMonth() + 1) + '-' + p(now.getDate()) + ' ' + p(now.getHours()) + ':' + p(now.getMinutes()) + ':' + p(now.getSeconds());
  }

  // 定位自动获取
  setTimeout(function () {
    document.getElementById('locStatus').textContent = '定位准确';
    document.getElementById('locStatus').className = 'status-badge ok';
    document.getElementById('locAddr').textContent = '江苏省南京市建邺区新城大道智慧新城中心大厦';
    document.getElementById('locTime').textContent = '定位时间：' + fmtTime();
  }, 1400);

  function onPhoto(input, key) {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      if (key === 'selfie') {
        document.getElementById('imgSelfie').src = e.target.result;
        document.getElementById('imgSelfie').style.display = 'block';
        document.getElementById('facePlaceholder').style.display = 'none';
        document.getElementById('faceStatus').textContent = '识别成功';
        document.getElementById('faceStatus').className = 'status-badge ok';
        document.getElementById('faceRetake').style.display = 'block';
      } else {
        document.getElementById('imgScene').src = e.target.result;
        document.getElementById('imgScene').style.display = 'block';
        document.getElementById('scenePlaceholder').style.display = 'none';
        document.getElementById('sceneStatus').textContent = '已拍照';
        document.getElementById('sceneStatus').className = 'status-badge ok';
        document.getElementById('shotScene').classList.add('has-photo');
        document.getElementById('sceneRetake').classList.add('show');
      }
      photos[key] = true;
      checkReady();
    };
    reader.readAsDataURL(file);
  }

  function resetShot(key) {
    photos[key] = null;
    if (key === 'selfie') {
      document.getElementById('imgSelfie').style.display = 'none';
      document.getElementById('facePlaceholder').style.display = '';
      document.getElementById('faceStatus').textContent = '待拍摄';
      document.getElementById('faceStatus').className = 'status-badge pending';
      document.getElementById('faceRetake').style.display = 'none';
      document.getElementById('fileSelfie').value = '';
    } else {
      document.getElementById('imgScene').style.display = 'none';
      document.getElementById('scenePlaceholder').style.display = '';
      document.getElementById('sceneStatus').textContent = '待拍摄';
      document.getElementById('sceneStatus').className = 'status-badge pending';
      document.getElementById('shotScene').classList.remove('has-photo');
      document.getElementById('sceneRetake').classList.remove('show');
      document.getElementById('fileScene').value = '';
    }
    checkReady();
  }

  function checkReady() {
    document.getElementById('submitBtn').disabled = !(photos.selfie && photos.scene);
  }

  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  function submitCheckin() {
    if (!photos.selfie || !photos.scene) return;
    toast('报到成功');
    setTimeout(function () { location.href = 'home.html'; }, 1400);
  }
</script>
</body>
</html>
