<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 派单编辑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --bg: #F7F8FA;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .de-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* 导航栏 */
  .de-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .de-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .de-nav .back-btn:active { transform: scale(0.9); }
  .de-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }

  .de-body {
    flex: 1; overflow-y: auto; scrollbar-width: none;
    padding: 14px 16px 26px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .de-body::-webkit-scrollbar { display: none; }

  /* 表单卡 */
  .f-card {
    background: #fff; border-radius: 16px; padding: 14px 15px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .f-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .f-head .no {
    width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .f-head .t { font-size: 14.5px; font-weight: 800; letter-spacing: .3px; }
  .f-head .sub { margin-left: auto; font-size: 10px; color: var(--faint); }
  .f-head .req { color: var(--red); }

  .field { margin-bottom: 11px; }
  .field:last-child { margin-bottom: 0; }
  .field .lab { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 6px; display: flex; align-items: center; gap: 3px; }
  .field .lab .req { color: var(--red); }

  /* 选择器按钮 */
  .fp-btn {
    width: 100%; height: 46px; display: flex; align-items: center; gap: 9px;
    background: #F5F7FA; border: 1.5px solid #E4E9F1; border-radius: 13px;
    padding: 0 13px; cursor: pointer; font-family: inherit;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .fp-btn .fp-ic { flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .fp-btn .fp-tx { flex: 1; min-width: 0; text-align: left; }
  .fp-btn .fp-val { font-size: 14px; font-weight: 700; color: var(--text); }
  .fp-btn .fp-val.ph { color: var(--faint); font-weight: 500; }
  .fp-btn .fp-tip { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }
  .fp-btn svg { flex-shrink: 0; color: #A5AEBE; }
  .fp-btn.on { border-color: var(--primary); background: #F2F7FF; box-shadow: 0 0 0 3px rgba(1,77,178,.10); }
  .fp-btn:active { transform: scale(0.99); }

  /* 行内两列 */
  .two-col { display: flex; gap: 10px; }
  .two-col .field { flex: 1; min-width: 0; }

  /* 文本输入 */
  .txt-input {
    width: 100%; height: 44px; border-radius: 12px; outline: none;
    border: 1.5px solid #E4E9F1; background: #F5F7FA;
    padding: 0 13px; font-size: 14px; color: var(--text); font-family: inherit;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .txt-input::placeholder { color: #B4BDCC; }
  .txt-input:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px rgba(1, 77, 178, .12);
  }
  .txt-input.err { border-color: var(--red); background: #FFF5F5; }

  /* 事由快捷 chips */
  .chip-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
  .chip {
    font-size: 12px; color: var(--sub); background: #F3F5F9;
    border: 1px solid #E8ECF3; border-radius: 100px; padding: 5px 12px;
    cursor: pointer; transition: all .18s; font-family: inherit;
  }
  .chip:active { transform: scale(0.95); }
  .chip.on { color: var(--primary); background: var(--blue-bg); border-color: var(--primary); font-weight: 700; }

  /* 图片上传 */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .photo-cell {
    aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; position: relative;
    border: 1.5px dashed #CBD5E1; background: #F0F2F7; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .photo-cell:active { transform: scale(0.97); }
  .photo-cell .ph { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); }
  .photo-cell .ph .cam-box {
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(135deg, #EFF6FF, #DCECFB); border: 1px solid #D6E6FA;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-cell .ph .txt { font-size: 10px; font-weight: 600; color: var(--sub); }
  .photo-cell.has { border-style: solid; border-color: #C6D2E4; }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cell .del {
    position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%;
    border: none; cursor: pointer; background: rgba(10, 22, 40, .62); color: #fff;
    font-size: 11px; line-height: 20px; display: none; text-align: center; padding: 0;
  }
  .photo-cell.has .del { display: block; }
  .photo-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
  }
  .photo-count { font-size: 11px; color: var(--muted); }
  .photo-count b { color: var(--primary); }
  .demo-link {
    border: none; background: none; cursor: pointer; color: var(--primary);
    font-size: 11px; font-weight: 700; font-family: inherit;
  }

  /* 备注 */
  .desc-input {
    width: 100%; min-height: 88px; border-radius: 12px; resize: none; outline: none;
    border: 1.5px solid #E4E9F1; background: #F5F7FA;
    padding: 11px 13px; font-size: 13px; line-height: 1.6; color: var(--text);
    font-family: inherit; transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .desc-input::placeholder { color: #B4BDCC; }
  .desc-input:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px rgba(1, 77, 178, .12);
  }
  .desc-count { text-align: right; font-size: 10.5px; color: var(--faint); margin-top: 5px; }

  /* 提交与删除 */
  .submit-btn {
    width: 100%; height: 50px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    font-family: inherit;
    box-shadow: 0 10px 22px rgba(1, 77, 178, 0.32);
    transition: transform .15s, opacity .2s;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { background: #C9D4E3; box-shadow: none; cursor: not-allowed; }
  /* 底部保存栏 */
  .save-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 14px;
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 18px rgba(15, 42, 86, .05);
  }
  .save-bar .submit-btn { flex: 1; }
  .save-bar .bar-del {
    width: 92px; height: 50px; flex-shrink: 0; border-radius: 14px;
    border: 1.5px solid #FECACA; background: #FFF5F5; color: var(--red);
    font-size: 15px; font-weight: 700; font-family: inherit; letter-spacing: 1px;
    cursor: pointer; transition: transform .15s;
  }
  .save-bar .bar-del:active { transform: scale(0.98); }

  /* ===== 底部弹层 ===== */
  .mask {
    position: absolute; inset: 0; background: rgba(7, 15, 30, 0.55);
    opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 300;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 310;
    background: #fff; border-radius: 22px 22px 0 0;
    transform: translateY(105%); transition: transform .32s cubic-bezier(.32, .72, .28, 1);
    box-shadow: 0 -12px 40px rgba(7, 15, 30, 0.18);
    display: flex; flex-direction: column; max-height: 70%;
    padding-bottom: 18px;
  }
  .sheet.show { transform: translateY(0); }
  .sh-handle { height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sh-handle::before { content: ''; width: 38px; height: 4px; border-radius: 2px; background: #E2E7EE; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 18px 12px; }
  .sh-head .t { font-size: 17px; font-weight: 800; }
  .sh-head .sh-x {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: #F0F2F7;
    cursor: pointer; color: var(--muted); font-size: 13px; line-height: 28px; text-align: center;
  }
  .sh-body { overflow-y: auto; padding: 0 18px; display: flex; flex-direction: column; gap: 13px; }

  /* 日历 */
  .cal-card { background: #F7F9FC; border-radius: 16px; padding: 12px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button {
    width: 30px; height: 30px; border-radius: 9px; border: none; background: #fff;
    cursor: pointer; color: var(--text); font-size: 16px; font-weight: 700;
    box-shadow: 0 1px 4px rgba(15,42,86,.08);
  }
  .cal-nav button:disabled { color: #C6CFDC; background: #F1F3F7; cursor: not-allowed; }
  .cal-nav .cal-t { font-size: 14.5px; font-weight: 800; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-week span {
    text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600;
    padding: 4px 0;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid button {
    height: 34px; border-radius: 10px; border: none; background: transparent;
    font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .cal-grid button.out { color: #C6CFDC; }
  .cal-grid button:not(.out):hover { background: #E9F0FB; }
  .cal-grid button.sel {
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    box-shadow: 0 4px 10px rgba(1,77,178,.30);
  }
  .cal-grid button.today:not(.sel) {
    color: var(--primary); font-weight: 800;
    box-shadow: inset 0 0 0 1.5px var(--primary);
  }
  .cal-note { font-size: 10.5px; color: var(--faint); text-align: center; padding-top: 2px; }

  /* 车辆列表 */
  .plate-row {
    display: flex; align-items: center; gap: 11px;
    padding: 12px 4px; border-radius: 13px; cursor: pointer;
    border-bottom: 1px dashed #EEF0F5;
  }
  .plate-row:last-child { border-bottom: none; }
  .plate-row:active { background: #F6F8FC; }
  .plate-row .pl {
    width: 92px; height: 34px; border-radius: 8px; background: #0A1628; color: #fff;
    font-size: 12.5px; font-weight: 800; letter-spacing: 1.2px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .plate-row .pl-m { flex: 1; min-width: 0; }
  .plate-row .pl-m .model { font-size: 13.5px; font-weight: 700; }
  .plate-row .pl-m .st { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .plate-row .radio {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid #CBD5E1; background: #fff;
  }
  .plate-row.on .radio { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px #fff; }
  .plate-row.dis { opacity: .45; cursor: not-allowed; }
  .plate-row .un-tag {
    font-size: 10px; color: var(--red); font-weight: 700; margin-left: 4px;
    background: var(--red-bg); padding: 2px 7px; border-radius: 100px;
  }

  /* 时间格 */
  .time-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
  .time-grid button {
    height: 42px; border-radius: 11px; border: 1.5px solid #E4E9F1;
    background: #F7F9FC; color: var(--text); font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; font-variant-numeric: tabular-nums;
    transition: all .15s;
  }
  .time-grid button.on { border-color: var(--primary); background: #F2F7FF; color: var(--primary); box-shadow: 0 0 0 2px rgba(1,77,178,.12); }
  .time-grid button:active { transform: scale(0.95); }
  .time-tip { font-size: 10.5px; color: var(--faint); text-align: center; }

  /* 删除确认 */
  .cf-ic {
    width: 56px; height: 56px; margin: 6px auto 12px; border-radius: 50%;
    background: var(--red-bg); color: var(--red);
    display: flex; align-items: center; justify-content: center;
  }
  .cf-t { font-size: 16px; font-weight: 800; text-align: center; }
  .cf-s { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 4px; line-height: 1.7; }
  .cf-ops { display: flex; gap: 10px; margin-top: 14px; }
  .cf-ops button {
    flex: 1; height: 46px; border-radius: 13px; cursor: pointer;
    font-size: 15px; font-weight: 700; font-family: inherit; letter-spacing: 1px;
    transition: transform .15s;
  }
  .cf-ops button:active { transform: scale(0.97); }
  .cf-ops .cf-no { border: 1px solid #DCE2EC; background: #fff; color: var(--sub); }
  .cf-ops .cf-yes { border: none; background: linear-gradient(135deg, #F87171, #DC2626); color: #fff; }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(16px);
    background: rgba(10, 22, 40, .9); color: #fff;
    padding: 9px 18px; border-radius: 100px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 400;
    white-space: nowrap; max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="page">
      <div class="statusbar">
        <span class="time">10:24</span>
        <span class="capsule"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>

      <div class="de-content">
        <div class="de-nav">
          <button class="back-btn" onclick="location.href='dispatch-records.html'" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="title" id="pageTitle">新增派单</span>
        </div>

        <div class="de-body">
          <!-- ① 行程安排 -->
          <div class="f-card">
            <div class="f-head"><span class="no">1</span><span class="t">行程安排</span><span class="sub"><span class="req">*</span> 必填</span></div>

            <div class="field">
              <div class="lab">出车日期<span class="req">*</span></div>
              <button type="button" class="fp-btn" id="dateBtn" onclick="openDateSheet()">
                <span class="fp-ic" style="background:#EFF6FF">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="#014DB2" stroke-width="1.7"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="#014DB2" stroke-width="1.7" stroke-linecap="round"/></svg>
                </span>
                <span class="fp-tx"><span class="fp-val" id="dateVal">请选择日期</span><span class="fp-tip">默认今天</span></span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>

            <div class="field" style="margin-bottom:0">
              <div class="lab">使用车辆<span class="req">*</span></div>
              <button type="button" class="fp-btn" id="plateBtn" onclick="openPlateSheet()">
                <span class="fp-ic" style="background:#0A1628">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2.5" stroke="#fff" stroke-width="1.7"/><path d="M6.5 7L8 3.5h8L17.5 7M6.5 13h11M6.5 16.2h4" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
                <span class="fp-tx">
                  <span class="fp-val ph" id="plateVal">请选择车辆</span>
                  <span class="fp-tip" id="plateTip">从可用车辆中选择</span>
                </span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>

          <!-- ② 行程信息 -->
          <div class="f-card">
            <div class="f-head"><span class="no">2</span><span class="t">行程信息</span></div>

            <div class="field">
              <div class="lab">用车事由<span class="req">*</span></div>
              <input class="txt-input" id="reasonInput" maxlength="20" placeholder="请输入用车事由，如：公务会议">
              <div class="chip-row" id="reasonChips"></div>
            </div>

            <div class="two-col">
              <div class="field">
                <div class="lab">出发时间<span class="req">*</span></div>
                <button type="button" class="fp-btn" onclick="openTimeSheet('dep')">
                  <span class="fp-tx"><span class="fp-val" id="depVal">请选择</span></span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
              <div class="field">
                <div class="lab">返回时间<span class="req">*</span></div>
                <button type="button" class="fp-btn" onclick="openTimeSheet('ret')">
                  <span class="fp-tx"><span class="fp-val" id="retVal">请选择</span></span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>

            <div class="field">
              <div class="lab">出发地点<span class="req">*</span></div>
              <input class="txt-input" id="fromInput" maxlength="40" placeholder="如：区政府门口">
            </div>
            <div class="field" style="margin-bottom:0">
              <div class="lab">目的地点<span class="req">*</span></div>
              <input class="txt-input" id="toInput" maxlength="40" placeholder="如：市政务服务中心">
            </div>
          </div>

          <!-- ③ 同行人员 -->
          <div class="f-card">
            <div class="f-head"><span class="no">3</span><span class="t">同行人员</span><span class="sub">选填</span></div>
            <div class="field" style="margin-bottom:0">
              <div class="lab">同行人员</div>
              <input class="txt-input" id="peerInput" maxlength="60" placeholder="直接输入同行人员姓名，多人用顿号、逗号分隔">
            </div>
          </div>

          <!-- ④ 图片上传 -->
          <div class="f-card">
            <div class="f-head"><span class="no">4</span><span class="t">图片上传</span><span class="sub">选填 · 最多 9 张</span></div>
            <div class="photo-grid" id="photoGrid">
              <div class="photo-cell" id="addCell" onclick="document.getElementById('photoFile').click()">
                <div class="ph">
                  <div class="cam-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#014DB2" stroke-width="1.6"/></svg>
                  </div>
                  <span class="txt">拍摄 / 相册</span>
                </div>
              </div>
            </div>
            <div class="photo-foot">
              <div class="photo-count">已上传 <b id="photoNum">0</b> / 9 张</div>
              <button type="button" class="demo-link" onclick="addDemoPhoto()">＋ 示例图片</button>
            </div>
            <input type="file" id="photoFile" accept="image/*" style="display:none" onchange="onPhoto(this)">
          </div>

          <!-- ⑤ 备注 -->
          <div class="f-card">
            <div class="f-head"><span class="no">5</span><span class="t">备注</span><span class="sub">选填</span></div>
            <textarea class="desc-input" id="noteInput" maxlength="200" placeholder="其他需要说明的事项，如接送时间、等候地点…"></textarea>
            <div class="desc-count"><span id="noteNum">0</span> / 200</div>
          </div>

        </div>

        <!-- 底部保存栏 -->
        <div class="save-bar">
          <button type="button" class="bar-del" id="delBarBtn" style="display:none" onclick="askDel()">删除</button>
          <button class="submit-btn" id="saveBtn" onclick="saveDispatch()">保存派单</button>
        </div>
      </div>
    </div>

    <!-- 弹层：日期 -->
    <div class="mask" id="mask" onclick="closeSheet()"></div>
    <div class="sheet" id="sheetDate">
      <div class="sh-handle"></div>
      <div class="sh-head">
        <span class="t">选择出车日期</span>
        <button class="sh-x" onclick="closeSheet()">✕</button>
      </div>
      <div class="sh-body">
        <div class="cal-card">
          <div class="cal-nav">
            <button type="button" id="calPrev" onclick="calNav(-1)">‹</button>
            <span class="cal-t" id="calTitle">2026年9月</span>
            <button type="button" id="calNext" onclick="calNav(1)">›</button>
          </div>
          <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="cal-note">蓝色为已选日期 · 支持选择今天及以后日期</div>
      </div>
    </div>

    <!-- 弹层：车辆 -->
    <div class="sheet" id="sheetPlate">
      <div class="sh-handle"></div>
      <div class="sh-head">
        <span class="t">选择车辆</span>
        <button class="sh-x" onclick="closeSheet()">✕</button>
      </div>
      <div class="sh-body">
        <div class="plate-list" id="plateList"></div>
      </div>
    </div>

    <!-- 弹层：时间 -->
    <div class="sheet" id="sheetTime">
      <div class="sh-handle"></div>
      <div class="sh-head">
        <span class="t" id="timeTitle">选择出发时间</span>
        <button class="sh-x" onclick="closeSheet()">✕</button>
      </div>
      <div class="sh-body">
        <div class="time-grid" id="timeGrid"></div>
        <div class="time-tip">点击时间即可选定 · 30 分钟粒度</div>
      </div>
    </div>

    <!-- 弹层：删除确认 -->
    <div class="sheet" id="delSheet">
      <div class="sh-handle"></div>
      <div class="sh-body">
        <div class="cf-ic">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="cf-t">删除这条派单？</div>
        <div class="cf-s">删除后不可恢复，请确认<br>该操作仅删除本地演示数据</div>
        <div class="cf-ops">
          <button class="cf-no" onclick="closeSheet()">取消</button>
          <button class="cf-yes" onclick="doDelete()">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var KEY = 'zp_dispatch_list';

  /* ========== 工具 ========== */
  function byId(id) { return document.getElementById(id); }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function dstr(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function weekText(d) { return '周' + '日一二三四五六'[d.getDay()]; }
  function hmMin(t) { var a = String(t).split(':'); return (+a[0]) * 60 + (+a[1] || 0); }
  function parseDate(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }

  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ========== 状态 ========== */
  var editId = null;      /* null = 新增 */
  var selDate = dstr(new Date());
  var selPlate = '';
  var selModel = '';
  var depTime = '';
  var retTime = '';
  var photos = [];
  var MAX_PHOTOS = 9, MAX_PEERS = 8;
  var REASONS = ['公务会议', '公务接待', '应急公务', '外出办事', '考察调研'];
  var VEHICLES = [
    { plate: '苏A·12345', model: '丰田 凯美瑞 2.5G', state: 'idle', st: '可用' },
    { plate: '苏A·67890', model: '大众 迈腾 330TSI', state: 'idle', st: '可用' },
    { plate: '苏A·54321', model: '奥迪 A6L 45TFSI', state: 'busy', st: '执行任务中' },
    { plate: '苏A·88888', model: '别克 GL8 陆尊', state: 'unbound', st: '未绑定' }
  ];
  var TIME_LIST = [];
  (function () {
    for (var h = 6; h <= 22; h++) {
      TIME_LIST.push(p2(h) + ':00');
      if (h !== 22) TIME_LIST.push(p2(h) + ':30');
    }
  })();

  /* ========== toast ========== */
  var toastTimer = null;
  function toast(msg) {
    var el = byId('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2000);
  }

  /* ========== 弹层 ========== */
  function showSheet(id) { byId(id).classList.add('show'); byId('mask').classList.add('show'); }
  function closeSheet() {
    ['sheetDate', 'sheetPlate', 'sheetTime', 'delSheet'].forEach(function (id) {
      byId(id).classList.remove('show');
    });
    byId('mask').classList.remove('show');
  }

  /* ========== 日期：日历 ========== */
  var CAL = { y: 2026, m: 8 };   /* 显示的年月（m 0 起） */
  function openDateSheet() {
    var d = parseDate(selDate);
    CAL.y = d.getFullYear(); CAL.m = d.getMonth();
    buildCal();
    showSheet('sheetDate');
  }
  function calNav(delta) {
    CAL.m += delta;
    if (CAL.m < 0) { CAL.m = 11; CAL.y--; }
    if (CAL.m > 11) { CAL.m = 0; CAL.y++; }
    buildCal();
  }
  function buildCal() {
    byId('calTitle').textContent = CAL.y + '年' + (CAL.m + 1) + '月';
    var today = new Date();
    var tStr = dstr(today);
    var first = new Date(CAL.y, CAL.m, 1);
    var startDow = first.getDay();
    var dim = new Date(CAL.y, CAL.m + 1, 0).getDate();
    var prevDim = new Date(CAL.y, CAL.m, 0).getDate();
    var h = '';
    for (var i = 0; i < 42; i++) {
      var cell = i - startDow + 1;
      var d, out;
      if (cell < 1) { d = prevDim + cell; out = true; }
      else if (cell > dim) { d = cell - dim; out = true; }
      else { d = cell; out = false; }
      var y = CAL.y, m = CAL.m;
      if (out && cell < 1) { m = CAL.m - 1; if (m < 0) { m = 11; y--; } }
      if (out && cell > dim) { m = CAL.m + 1; if (m > 11) { m = 0; y++; } }
      var ds = y + '-' + p2(m + 1) + '-' + p2(d);
      var cls = out ? 'out' : '';
      if (!out) {
        if (ds === selDate) cls += ' sel';
        else if (ds === tStr) cls += ' today';
      }
      h += '<button type="button" class="' + cls + '"' +
        (out ? '' : ' onclick="pickDate(\'' + ds + '\')"') + '>' + d + '</button>';
    }
    byId('calGrid').innerHTML = h;
  }
  function pickDate(ds) {
    selDate = ds;
    var d = parseDate(ds);
    byId('dateVal').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekText(d);
    byId('dateVal').classList.remove('ph');
    byId('dateBtn').classList.add('on');
    closeSheet();
  }

  /* ========== 车辆 ========== */
  function openPlateSheet() {
    var list = byId('plateList');
    var h = '';
    VEHICLES.forEach(function (v) {
      var can = v.state === 'idle';
      var on = v.plate === selPlate;
      h +=
        '<div class="plate-row' + (on ? ' on' : '') + (can ? '' : ' dis') + '"' +
        (can ? ' onclick="pickPlate(\'' + v.plate + '\',\'' + esc(v.model) + '\')"' : '') + '>' +
        '<span class="pl">' + v.plate + '</span>' +
        '<span class="pl-m"><span class="model">' + esc(v.model) + '</span>' +
        '<span class="st">' + v.st + (v.state === 'busy' ? ' · 暂不可选' : '') + '</span></span>' +
        '<span class="radio"></span>' +
        '</div>';
    });
    list.innerHTML = h;
    showSheet('sheetPlate');
  }
  function pickPlate(plate, model) {
    selPlate = plate;
    selModel = model;
    byId('plateVal').textContent = plate;
    byId('plateVal').classList.remove('ph');
    byId('plateTip').textContent = model;
    byId('plateBtn').classList.add('on');
    closeSheet();
  }

  /* ========== 时间 ========== */
  var timeMode = 'dep';
  function openTimeSheet(mode) {
    timeMode = mode;
    byId('timeTitle').textContent = mode === 'dep' ? '选择出发时间' : '选择返回时间';
    var cur = mode === 'dep' ? depTime : retTime;
    var h = '';
    TIME_LIST.forEach(function (t) {
      h += '<button type="button" class="' + (t === cur ? 'on' : '') + '" onclick="pickTime(\'' + t + '\')">' + t + '</button>';
    });
    byId('timeGrid').innerHTML = h;
    showSheet('sheetTime');
  }
  function pickTime(t) {
    if (timeMode === 'dep') {
      depTime = t;
      byId('depVal').textContent = t;
    } else {
      retTime = t;
      byId('retVal').textContent = t;
    }
    closeSheet();
  }

  /* ========== 事由快捷 ========== */
  function renderReasonChips() {
    var h = '';
    REASONS.forEach(function (r, i) {
      h += '<button type="button" class="chip" data-i="' + i + '" onclick="pickReason(' + i + ')">' + r + '</button>';
    });
    byId('reasonChips').innerHTML = h;
  }
  function pickReason(i) {
    var input = byId('reasonInput');
    if (input.value === REASONS[i]) { input.value = ''; }
    else { input.value = REASONS[i]; }
    syncChips();
  }
  function syncChips() {
    var v = byId('reasonInput').value;
    var chips = byId('reasonChips').children;
    for (var i = 0; i < chips.length; i++) {
      var ch = chips[i];
      if (REASONS[+ch.getAttribute('data-i')] === v) ch.classList.add('on');
      else ch.classList.remove('on');
    }
  }

  /* ========== 同行人员 ========== */
  function splitPeers(t) {
    var a = String(t == null ? '' : t).split(/[,，、;；\s]+/);
    var out = [];
    a.forEach(function (s) {
      s = s.trim();
      if (s && out.indexOf(s) < 0) out.push(s);
    });
    return out;
  }

  /* ========== 图片 ========== */
  function demoImg(k) {
    var colors = [
      { bg: '#EAF1FC', c1: '#014DB2', c2: '#B9D2F0' },
      { bg: '#ECFDF5', c1: '#047857', c2: '#A7F3D0' },
      { bg: '#FFFBEB', c1: '#D97706', c2: '#FDE68A' }
    ];
    var c = colors[k % colors.length];
    var s = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='200'>" +
      "<rect width='320' height='200' rx='14' fill='" + c.bg + "'/>" +
      "<rect x='120' y='56' width='80' height='16' rx='8' fill='" + c.c1 + "' opacity='.85'/>" +
      "<rect x='80' y='88' width='160' height='10' rx='5' fill='" + c.c2 + "'/>" +
      "<rect x='80' y='108' width='140' height='10' rx='5' fill='" + c.c2 + "'/>" +
      "<circle cx='60' cy='150' r='6' fill='" + c.c1 + "' opacity='.7'/>" +
      "<rect x='120' y='142' width='100' height='14' rx='7' fill='" + c.c1 + "' opacity='.9'/>" +
      "</svg>";
    return 'data:image/svg+xml,' + encodeURIComponent(s);
  }
  function addDemoPhoto() {
    if (photos.length >= MAX_PHOTOS) { toast('最多上传 ' + MAX_PHOTOS + ' 张照片'); return; }
    photos.push(demoImg(photos.length));
    renderPhotos();
  }
  function onPhoto(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    if (photos.length >= MAX_PHOTOS) { toast('最多上传 ' + MAX_PHOTOS + ' 张照片'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      photos.push(e.target.result);
      renderPhotos();
      input.value = '';
    };
    reader.readAsDataURL(file);
  }
  function removePhoto(i) {
    photos.splice(i, 1);
    renderPhotos();
  }
  function renderPhotos() {
    var grid = byId('photoGrid');
    grid.innerHTML = '';
    photos.forEach(function (src, i) {
      var cell = document.createElement('div');
      cell.className = 'photo-cell has';
      cell.innerHTML =
        '<img src="' + src + '" alt="派单图片' + (i + 1) + '">' +
        '<button class="del" onclick="event.stopPropagation();removePhoto(' + i + ')">✕</button>';
      grid.appendChild(cell);
    });
    if (photos.length < MAX_PHOTOS) {
      var add = document.createElement('div');
      add.className = 'photo-cell';
      add.id = 'addCell';
      add.onclick = function () { byId('photoFile').click(); };
      add.innerHTML =
        '<div class="ph"><div class="cam-box">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#014DB2" stroke-width="1.6"/></svg>' +
        '</div><span class="txt">拍摄 / 相册</span></div>';
      grid.appendChild(add);
    }
    byId('photoNum').textContent = photos.length;
  }

  /* ========== 备注计数 ========== */
  byId('noteInput').addEventListener('input', function () {
    byId('noteNum').textContent = this.value.length;
  });
  byId('reasonInput').addEventListener('input', syncChips);

  /* ========== 载入 / 保存 ========== */
  function parseQuery() {
    var q = location.search;
    if (q.indexOf('id=') < 0) return null;
    return decodeURIComponent(q.split('id=')[1].split('&')[0]);
  }

  function initForm() {
    var qid = parseQuery();
    byId('dateVal').textContent = (parseDate(selDate).getMonth() + 1) + '月' +
      parseDate(selDate).getDate() + '日 ' + weekText(parseDate(selDate));
    renderReasonChips();
    renderPhotos();
    if (!qid) return;
    /* 编辑模式 */
    var list = load();
    var rec = null;
    list.forEach(function (x) { if (x.id === qid) rec = x; });
    if (!rec) { toast('未找到该派单'); return; }
    editId = qid;
    byId('pageTitle').textContent = '编辑派单';
    byId('saveBtn').textContent = '保存修改';
    byId('delBarBtn').style.display = 'block';

    selDate = rec.date;
    var d = parseDate(selDate);
    byId('dateVal').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekText(d);
    byId('dateVal').classList.remove('ph');
    byId('dateBtn').classList.add('on');

    if (rec.plate) {
      selPlate = rec.plate; selModel = rec.model || '';
      byId('plateVal').textContent = rec.plate;
      byId('plateVal').classList.remove('ph');
      byId('plateTip').textContent = rec.model || '';
      byId('plateBtn').classList.add('on');
    }
    byId('reasonInput').value = rec.reason || '';
    syncChips();
    depTime = rec.depTime || ''; retTime = rec.retTime || '';
    byId('depVal').textContent = depTime || '请选择';
    byId('retVal').textContent = retTime || '请选择';
    byId('fromInput').value = rec.from || '';
    byId('toInput').value = rec.to || '';
    byId('peerInput').value = (rec.peers || []).join('、');
    photos = (rec.photos || []).slice();
    renderPhotos();
    byId('noteInput').value = rec.note || '';
    byId('noteNum').textContent = byId('noteInput').value.length;
  }

  function markErr(id) {
    var el = byId(id);
    el.classList.add('err');
    setTimeout(function () { el.classList.remove('err'); }, 1800);
  }

  function saveDispatch() {
    var reason = byId('reasonInput').value.trim();
    var from = byId('fromInput').value.trim();
    var to = byId('toInput').value.trim();
    var note = byId('noteInput').value.trim();

    if (!selDate) { toast('请选择出车日期'); return; }
    if (!selPlate) { toast('请选择使用车辆'); return; }
    if (!reason) { toast('请填写用车事由'); markErr('reasonInput'); return; }
    if (!depTime) { toast('请选择出发时间'); return; }
    if (!retTime) { toast('请选择返回时间'); return; }
    if (hmMin(retTime) <= hmMin(depTime)) {
      toast('返回时间需晚于出发时间');
      return;
    }
    if (!from) { toast('请填写出发地点'); markErr('fromInput'); return; }
    if (!to) { toast('请填写目的地点'); markErr('toInput'); return; }
    var peerArr = splitPeers(byId('peerInput').value);
    if (peerArr.length > MAX_PEERS) { toast('同行人员最多 ' + MAX_PEERS + ' 人'); return; }

    var list = load();
    if (editId) {
      list.forEach(function (x) {
        if (x.id === editId) {
          x.date = selDate; x.plate = selPlate; x.model = selModel;
          x.reason = reason; x.depTime = depTime; x.retTime = retTime;
          x.from = from; x.to = to; x.peers = peerArr.slice();
          x.photos = photos.slice(); x.note = note;
        }
      });
    } else {
      list.push({
        id: 'D' + Date.now(),
        date: selDate, plate: selPlate, model: selModel,
        reason: reason, depTime: depTime, retTime: retTime,
        from: from, to: to, peers: peerArr.slice(),
        photos: photos.slice(), note: note
      });
    }
    save(list);
    var btn = byId('saveBtn');
    btn.disabled = true;
    btn.textContent = editId ? '修改成功 ✓' : '新增成功 ✓';
    toast(editId ? '派单修改成功' : '派单新增成功');
    setTimeout(function () { location.href = 'dispatch-records.html'; }, 900);
  }

  /* ========== 删除 ========== */
  function askDel() { showSheet('delSheet'); }
  function doDelete() {
    var list = load().filter(function (x) { return x.id !== editId; });
    save(list);
    closeSheet();
    toast('派单已删除');
    setTimeout(function () { location.href = 'dispatch-records.html'; }, 700);
  }

  /* ========== 启动 ========== */
  initForm();
</script>
</body>
</html>
