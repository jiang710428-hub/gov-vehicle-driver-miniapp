<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 结束里程</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-2: #047857;
    --green-bg: #ECFDF5;
    --amber: #F59E0B;
    --red: #EF4444;
    --red-2: #B91C1C;
    --red-bg: #FEF2F2;
    --bg: #F7F8FA;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .em-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column;
    overflow-y: auto; scrollbar-width: none;
  }
  .em-content::-webkit-scrollbar { display: none; }

  .em-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative; border-bottom: 1px solid #EEF0F5;
    background: var(--bg);
  }
  .em-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .em-nav .back-btn:active { transform: scale(0.9); }
  .em-nav .title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 700; }

  .em-body { flex: 1; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 12px; }

  /* 步骤进度 */
  .step-head {
    display: flex; align-items: center; gap: 10px;
    background: #fff; border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
  }
  .step-head .snum {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }
  .step-head .stxt { flex: 1; min-width: 0; }
  .step-head .stxt .t { font-size: 14px; font-weight: 700; }
  .step-head .stxt .s { font-size: 11px; color: var(--muted); }
  .step-bar { width: 84px; height: 6px; border-radius: 3px; background: #E5EAF3; overflow: hidden; flex-shrink: 0; }
  .step-bar > span { display: block; height: 100%; width: 100%; border-radius: 3px; background: linear-gradient(90deg, #0A5FD4, #4C8DF0); }

  /* 通用卡片 */
  .sec-card {
    background: #fff; border-radius: 14px; padding: 13px 14px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
  }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
  .sec-head .h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .sec-head .h3 .bar { width: 4px; height: 14px; border-radius: 2px; background: linear-gradient(180deg, #0A5FD4, #014DB2); }
  .mini-badge {
    font-size: 10.5px; font-weight: 700; border-radius: 100px; padding: 2px 9px;
    background: #F3F4F6; color: var(--sub);
  }
  .mini-badge.ok { background: var(--green-bg); color: var(--green-2); }
  .mini-badge.bad { background: var(--red-bg); color: var(--red-2); }
  .mini-badge.pend { background: #FFFBEB; color: var(--amber); }

  /* 仪表盘拍摄区 */
  .dash-shot {
    border-radius: 12px; height: 150px; background: #F0F2F7; overflow: hidden;
    position: relative; cursor: pointer; border: 1.5px dashed #CBD5E1;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s, transform .15s;
  }
  .dash-shot:active { transform: scale(0.99); }
  .dash-shot.has { border-style: solid; border-color: #C6D2E4; }
  .dash-shot .ph {
    display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted);
  }
  .dash-shot .ph .cam-box {
    width: 50px; height: 50px; border-radius: 15px;
    background: linear-gradient(135deg, #EFF6FF, #DCECFB); border: 1px solid #D6E6FA;
    box-shadow: 0 4px 12px rgba(15,42,86,.10);
    display: flex; align-items: center; justify-content: center;
  }
  .dash-shot .ph .txt { font-size: 12.5px; font-weight: 600; color: var(--sub); }
  .dash-shot .ph .tip { font-size: 10.5px; color: var(--faint); }
  .dash-shot img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .dash-shot .retake {
    position: absolute; right: 8px; top: 8px; display: none;
    padding: 5px 12px; border-radius: 100px; border: none; cursor: pointer;
    background: rgba(255,255,255,.92); color: #374151; font-size: 11.5px; font-weight: 600;
    box-shadow: 0 2px 8px rgba(0,0,0,.16);
  }
  .dash-shot .retake.show { display: block; }

  /* 本次起始里程展示 */
  .last-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--blue-bg); border: 1px solid #D6E6FA; border-radius: 12px;
    padding: 12px 14px;
  }
  .last-row .pin {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(15,42,86,.08);
  }
  .last-row .txt { flex: 1; min-width: 0; }
  .last-row .lbl { font-size: 11px; color: var(--sub); letter-spacing: .5px; }
  .last-row .val {
    font-size: 19px; font-weight: 800; color: var(--primary); margin-top: 2px;
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
  }
  .last-row .val .unit { font-size: 11.5px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .last-row .src { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  /* 结束里程输入 */
  /* km 单位内嵌于输入框右侧 */
  .mile-input-wrap { position: relative; width: 100%; }
  .mile-input-wrap .unit-box {
    position: absolute; top: 50%; right: 16px; transform: translateY(-50%);
    font-size: 14px; font-weight: 700; color: var(--sub); pointer-events: none;
  }
  .mile-input {
    width: 100%; height: 48px; border-radius: 12px; border: 1.5px solid #E2E8F0;
    background: #F5F7FA; padding: 0 50px 0 16px;
    font-size: 21px; font-weight: 800; color: var(--text);
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
    outline: none; transition: border-color .2s, background .2s, box-shadow .2s;
    box-sizing: border-box;
  }
  .mile-input::-webkit-outer-spin-button,
  .mile-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .mile-input[type=number] { -moz-appearance: textfield; }
  .mile-input::placeholder { font-size: 13px; font-weight: 500; color: var(--faint); font-family: "Sarasa Gothic SC", sans-serif; }
  .mile-input:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px rgba(1, 77, 178, .12);
  }
  .input-tip { font-size: 11px; color: var(--faint); margin-top: 8px; line-height: 1.6; }

  /* 360 环视网格 */
  .cir-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .cir-cell {
    background: #F8FAFD; border: 1px solid var(--line); border-radius: 12px;
    padding: 8px; display: flex; flex-direction: column; gap: 7px; align-items: center;
    transition: border-color .2s;
  }
  .cir-cell.err { border-color: #FCA5A5; background: #FFF8F8; grid-column: 1 / -1; }
  .cir-cell.err .cir-shot { height: 96px; }
  .cir-abn { width: 100%; }
  .cir-name { font-size: 11.5px; font-weight: 700; color: var(--text); align-self: flex-start; display: flex; align-items: center; gap: 4px; }
  .cir-name .idx {
    width: 15px; height: 15px; border-radius: 50%; background: #E5EDF9; color: var(--primary);
    font-size: 9px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .cir-shot {
    width: 100%; height: 64px; border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 1.5px dashed #C6D2E4; background: #F0F3F9;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .cir-shot .ph { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); }
  .cir-shot .ph .txt { font-size: 9.5px; }
  .cir-shot img { width: 100%; height: 100%; object-fit: cover; display: none; }

  /* 正常/异常 分段开关 */
  .seg {
    display: flex; background: #EEF0F5; border-radius: 7px; padding: 2px; width: 100%;
  }
  .seg button {
    flex: 1; border: none; background: transparent; font-family: inherit;
    font-size: 10.5px; font-weight: 600; padding: 4px 0; border-radius: 5px;
    color: #8A94A6; cursor: pointer; transition: background .15s, color .15s;
  }
  .seg button.ok.on { background: #fff; color: var(--green-2); box-shadow: 0 1px 4px rgba(4,120,87,.18); }
  .seg button.bad.on { background: #fff; color: var(--red-2); box-shadow: 0 1px 4px rgba(185,28,28,.18); }

  /* 异常填写面板 */
  .ab-panel {
    display: none; margin: 0 0 4px; padding: 10px 11px;
    background: #FFF8F8; border: 1px solid #FBD5D5; border-radius: 10px;
  }
  .ab-panel.show { display: block; }
  .ab-field { margin-bottom: 9px; }
  .ab-field:last-child { margin-bottom: 0; }
  .ab-label { font-size: 11px; font-weight: 700; color: var(--red-2); margin-bottom: 5px; }
  .ab-label .req { color: var(--red); margin-left: 2px; }
  .ab-select {
    width: 100%; height: 32px; border-radius: 8px; border: 1px solid #E3D5D5;
    background: #fff; padding: 0 8px; font-family: inherit; font-size: 12px; color: var(--text);
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none'><path d='M6 9l6 6 6-6' stroke='%238A94A6' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 9px center;
  }
  .ab-up {
    display: flex; align-items: center; gap: 8px;
  }
  .ab-up-btn {
    width: 54px; height: 54px; border-radius: 9px; border: 1.5px dashed #E0A6A6;
    background: #fff; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .ab-up-btn:active { transform: scale(.95); }
  .ab-up-img {
    width: 54px; height: 54px; border-radius: 9px; overflow: hidden; flex-shrink: 0;
    display: none; border: 1px solid #E3D5D5;
  }
  .ab-up-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ab-up-tip { font-size: 10.5px; color: var(--muted); line-height: 1.5; }
  .ab-text {
    width: 100%; min-height: 44px; border-radius: 8px; border: 1px solid #E3D5D5;
    background: #fff; padding: 7px 9px; font-family: inherit; font-size: 12px; color: var(--text);
    resize: none; outline: none; line-height: 1.5;
  }
  .ab-text:focus { border-color: var(--red); }
  .ab-text::placeholder { color: #B6BDC9; }

  /* 提交按钮 */
  .submit-btn {
    margin-top: 2px; height: 48px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 1px;
    box-shadow: 0 10px 22px rgba(1, 77, 178, 0.32);
    transition: transform .15s, opacity .2s;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled {
    background: #C9D4E3; box-shadow: none; cursor: not-allowed;
  }
  .submit-tip { text-align: center; font-size: 11px; color: var(--muted); }

  /* toast */
  .toast {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 60px; z-index: 200;
    background: rgba(10,22,40,.88); color: #fff;
    font-size: 13px; padding: 10px 18px; border-radius: 100px;
    opacity: 0; pointer-events: none; transition: opacity .25s, bottom .25s;
    white-space: nowrap; max-width: 86%; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; bottom: 76px; }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="page">
      <div class="statusbar">
        <span class="time">19:05</span>
        <span class="capsule">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </span>
      </div>

      <div class="em-content">
        <div class="em-nav">
          <button class="back-btn" onclick="location.href='home.html'" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="title">结束里程</span>
        </div>

        <div class="em-body">
          <!-- 步骤进度 -->
          <div class="step-head">
            <span class="snum">7</span>
            <div class="stxt">
              <div class="t">结束里程</div>
              <div class="s">第 7 步 · 共 7 步</div>
            </div>
            <div class="step-bar"><span></span></div>
          </div>

          <!-- 结束公里数 -->
          <div class="sec-card">
            <div class="sec-head">
              <span class="h3"><span class="bar"></span>结束公里数</span>
              <span class="mini-badge pend" id="dashBadge">待拍摄</span>
            </div>

            <div class="dash-shot" id="dashShot" onclick="document.getElementById('dashFile').click()">
              <div class="ph">
                <div class="cam-box">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#014DB2" stroke-width="1.6"/></svg>
                </div>
                <span class="txt">点击拍摄仪表盘照片</span>
                <span class="tip">需清晰显示总里程数 · 仅支持相机拍摄</span>
              </div>
              <img id="dashImg" alt="仪表盘照片">
              <button class="retake" id="dashRetake" onclick="event.stopPropagation();resetDash()">重新拍摄</button>
            </div>
            <input type="file" id="dashFile" accept="image/*" capture="environment" style="display:none" onchange="onDash(this)">

            <div style="height:12px"></div>

            <!-- 本次起始里程（参考） -->
            <div class="last-row">
              <div class="pin">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 17h16M6 17V9h2.5v8M11 17V6h2.5v11M16 17v-6h2.5v6" stroke="#014DB2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </div>
              <div class="txt">
                <div class="lbl">苏A·12345 · 本次起始里程数</div>
                <div class="val">12580<span class="unit">km</span></div>
                <div class="src">来源：系统自动读取 · 2026-09-02 08:15</div>
              </div>
            </div>

            <div style="height:12px"></div>

            <!-- 填写结束里程 -->
            <div class="mile-input-wrap">
              <input class="mile-input" id="mileInput" type="number" inputmode="decimal" min="0" step="1"
                     placeholder="请输入本次结束里程数" oninput="updateState()">
              <span class="unit-box">km</span>
            </div>
            <div class="input-tip">请对照仪表盘照片上的总里程数填写，支持整数。</div>
          </div>

          <!-- 车辆360°环视检查 -->
          <div class="sec-card">
            <div class="sec-head">
              <span class="h3"><span class="bar"></span>车辆360°环视检查</span>
              <span class="mini-badge" id="cirBadge">已拍摄 0/6</span>
            </div>
            <div class="cir-grid" id="cirGrid"></div>
            <div class="input-tip" style="margin-top:10px;">需拍摄左前、正前、右前、右后、正后、左后 6 个方位照片；默认全部正常，可自行标记异常。</div>
          </div>

          <!-- 提交 -->
          <button class="submit-btn" id="submitBtn" disabled onclick="submitEnd()">确认结束里程</button>
          <div class="submit-tip">需完成仪表盘照片拍摄、填写结束里程并完成 6 个方位环视拍摄后方可提交</div>
        </div>
      </div>

      <div class="toast" id="toast"></div>
    </div>
  </div>

  <input type="file" id="camInput" accept="image/*" capture="environment" style="display:none">

<script>
  /* ---------------- 数据定义 ---------------- */
  var CIR = [
    { key: 'lf', name: '左前' }, { key: 'cf', name: '正前' }, { key: 'rf', name: '右前' },
    { key: 'rb', name: '右后' }, { key: 'cb', name: '正后' }, { key: 'lb', name: '左后' }
  ];
  var AB_CATS = ['碰擦', '划痕', '凹陷', '裂纹', '灯光故障', '轮胎异常', '制动异常', '发动机异常', '设备故障', '随车物品缺失', '其他'];

  var START_MILE = 12580;  /* 本次起始里程 */
  var dashPhoto = '';
  var camTarget = null;

  var cirState = {};
  CIR.forEach(function (c) { cirState[c.key] = { photo: '', abn: false, cat: '', desc: '', aphoto: '' }; });

  /* ---------------- toast ---------------- */
  var toastTimer;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ---------------- 仪表盘拍照 ---------------- */
  function onDash(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      dashPhoto = e.target.result;
      var img = document.getElementById('dashImg');
      img.src = dashPhoto;
      img.style.display = 'block';
      var shot = document.getElementById('dashShot');
      shot.classList.add('has');
      shot.querySelector('.ph').style.display = 'none';
      document.getElementById('dashRetake').classList.add('show');
      var b = document.getElementById('dashBadge');
      b.textContent = '已拍摄';
      b.className = 'mini-badge ok';
      updateState();
    };
    reader.readAsDataURL(f);
  }

  function resetDash() {
    dashPhoto = '';
    var img = document.getElementById('dashImg');
    img.style.display = 'none';
    img.removeAttribute('src');
    var shot = document.getElementById('dashShot');
    shot.classList.remove('has');
    shot.querySelector('.ph').style.display = '';
    document.getElementById('dashRetake').classList.remove('show');
    document.getElementById('dashFile').value = '';
    var b = document.getElementById('dashBadge');
    b.textContent = '待拍摄';
    b.className = 'mini-badge pend';
    updateState();
  }

  /* ---------------- 360 环视 ---------------- */
  function buildCir() {
    var grid = document.getElementById('cirGrid');
    CIR.forEach(function (c, i) {
      var cell = document.createElement('div');
      cell.className = 'cir-cell';
      cell.id = 'cell-' + c.key;
      cell.innerHTML =
        '<span class="cir-name"><span class="idx">' + (i + 1) + '</span>' + c.name + '</span>' +
        '<div class="cir-shot" onclick="takePhoto(\'cir\', \'' + c.key + '\')">' +
          '<div class="ph">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#8A94A6" stroke-width="1.6"/></svg>' +
            '<span class="txt">点击拍摄</span>' +
          '</div>' +
          '<img id="cirImg-' + c.key + '" alt="' + c.name + '">' +
        '</div>' +
        '<div class="seg">' +
          '<button class="ok on" id="cirOk-' + c.key + '" onclick="setCir(\'' + c.key + '\', false)">正常</button>' +
          '<button class="bad" id="cirBad-' + c.key + '" onclick="setCir(\'' + c.key + '\', true)">异常</button>' +
        '</div>' +
        '<div class="cir-abn ab-panel" id="cirAbn-' + c.key + '">' +
          '<div class="ab-field">' +
            '<div class="ab-label">异常分类<span class="req">*</span></div>' +
            '<select class="ab-select" id="cirCat-' + c.key + '" onchange="cirState[\'' + c.key + '\'].cat=this.value">' +
              '<option value="">请选择异常分类</option>' +
              AB_CATS.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') +
            '</select>' +
          '</div>' +
          '<div class="ab-field">' +
            '<div class="ab-label">异常部位照片<span class="req">*</span></div>' +
            '<div class="ab-up">' +
              '<div class="ab-up-btn" onclick="takePhoto(\'cirab\', \'' + c.key + '\')">' +
                '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#B91C1C" stroke-width="2" stroke-linecap="round"/></svg>' +
              '</div>' +
              '<div class="ab-up-img" id="cirAbnImgBox-' + c.key + '"><img id="cirAbnImg-' + c.key + '" alt="异常照片"></div>' +
              '<div class="ab-up-tip">仅支持相机拍摄<br>近景拍摄异常部位</div>' +
            '</div>' +
          '</div>' +
          '<div class="ab-field">' +
            '<div class="ab-label">文字说明<span class="req">*</span></div>' +
            '<textarea class="ab-text" id="cirDesc-' + c.key + '" rows="2" placeholder="请描述该方位异常情况（必填）" oninput="cirState[\'' + c.key + '\'].desc=this.value"></textarea>' +
          '</div>' +
        '</div>';
      grid.appendChild(cell);
    });
    updateCirBadge();
  }

  function setCir(key, abn) {
    cirState[key].abn = abn;
    document.getElementById('cirOk-' + key).className = abn ? 'ok' : 'ok on';
    document.getElementById('cirBad-' + key).className = abn ? 'bad on' : 'bad';
    var cell = document.getElementById('cell-' + key);
    cell.className = abn ? 'cir-cell err' : 'cir-cell';
    var panel = document.getElementById('cirAbn-' + key);
    if (abn) {
      panel.classList.add('show');
      if (!cirState[key].photo) {
        toast('「' + nameOfCir(key) + '」已标记异常，请拍摄该方位照片');
      }
    } else {
      panel.classList.remove('show');
      cirState[key].cat = ''; cirState[key].desc = ''; cirState[key].aphoto = '';
      var sel = document.getElementById('cirCat-' + key);
      var ta = document.getElementById('cirDesc-' + key);
      var img = document.getElementById('cirAbnImg-' + key);
      var box = document.getElementById('cirAbnImgBox-' + key);
      if (sel) sel.value = '';
      if (ta) ta.value = '';
      if (img) img.removeAttribute('src');
      if (box) box.style.display = 'none';
    }
    updateCirBadge();
    updateState();
  }

  function nameOfCir(key) {
    for (var i = 0; i < CIR.length; i++) if (CIR[i].key === key) return CIR[i].name;
    return key;
  }

  function updateCirBadge() {
    var n = 0;
    CIR.forEach(function (c) { if (cirState[c.key].photo) n++; });
    var el = document.getElementById('cirBadge');
    el.textContent = '已拍摄 ' + n + '/6';
    var anyAbn = CIR.some(function (c) { return cirState[c.key].abn; });
    el.className = 'mini-badge ' + (anyAbn ? 'bad' : (n === 6 ? 'ok' : ''));
  }

  /* ---------------- 拍照 ---------------- */
  function takePhoto(type, id) {
    camTarget = { type: type, id: id };
    document.getElementById('camInput').click();
  }

  document.getElementById('camInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f || !camTarget) { this.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      if (camTarget.type === 'cir') {
        var key = camTarget.id;
        cirState[key].photo = e.target.result;
        var img = document.getElementById('cirImg-' + key);
        img.src = e.target.result;
        img.style.display = 'block';
        var shot = img.parentElement;
        shot.style.borderStyle = 'solid';
        shot.style.borderColor = '#C6D2E4';
        updateCirBadge();
        updateState();
      } else {
        var ck = camTarget.id;
        cirState[ck].aphoto = e.target.result;
        var aimg = document.getElementById('cirAbnImg-' + ck);
        aimg.src = e.target.result;
        document.getElementById('cirAbnImgBox-' + ck).style.display = 'block';
      }
    };
    reader.readAsDataURL(f);
    this.value = '';
  });

  /* ---------------- 提交校验 ---------------- */
  function updateState() {
    var v = parseFloat(document.getElementById('mileInput').value);
    var allShot = CIR.every(function (c) { return cirState[c.key].photo; });
    var ok = !!dashPhoto && !isNaN(v) && v >= 0 && allShot;
    document.getElementById('submitBtn').disabled = !ok;
  }

  function submitEnd() {
    var v = parseFloat(document.getElementById('mileInput').value);
    if (!dashPhoto) { toast('请先拍摄仪表盘照片'); return; }
    if (isNaN(v) || v < 0) { toast('请填写结束里程'); return; }
    if (v < START_MILE) { toast('结束里程不能小于本次起始里程 ' + START_MILE + ' km'); return; }

    var miss = [];
    CIR.forEach(function (c) { if (!cirState[c.key].photo) miss.push(c.name); });
    if (miss.length) { toast('请完成360°环视拍照：' + miss.join('、')); return; }

    for (var k = 0; k < CIR.length; k++) {
      var ck = CIR[k], cs = cirState[ck.key];
      if (cs.abn) {
        if (!cs.cat) { toast('环视「' + ck.name + '」请选择异常分类'); return; }
        if (!cs.aphoto) { toast('环视「' + ck.name + '」请上传异常部位照片'); return; }
        if (!cs.desc.trim()) { toast('环视「' + ck.name + '」请填写异常说明'); return; }
      }
    }

    var trip = v - START_MILE;
    var bad = 0;
    CIR.forEach(function (c) { if (cirState[c.key].abn) bad++; });
    toast('结束里程已提交：' + v + ' km · 本次用车 ' + trip + ' km' + (bad ? '（环视异常 ' + bad + ' 项）' : ''));
    setTimeout(function () { location.href = 'home.html'; }, 1600);
  }

  buildCir();
</script>
</body>
</html>
