<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南京南部新城 · 驾驶员端登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --blue: #3D7FE8;
    --text: #0A1628;
    --sub: #5B6B7E;
    --faint: #A8B3C1;
    --line: #E8EDF3;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #E8F1FA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px;
    color: var(--text);
    overflow-y: auto;
  }

  .phone {
    width: 375px;
    max-width: 100%;
    height: 812px;
    background: var(--text);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative;
    overflow: hidden;
  }

  .notch { display: none; }

  .page {
    position: absolute; inset: 0;
    background: url('img/login-bg-final.jpg?v=4') no-repeat center top / cover;
  }

  .login-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: 0 12px 76px;
    overflow-y: auto; scrollbar-width: none;
  }
  .login-content::-webkit-scrollbar { display: none; }

  /* ===== 顶部标题区 ===== */
  .hero { padding: 58px 12px 0; color: #fff; }
  .hello {
    font-size: 17px; font-weight: 700; letter-spacing: 1.5px;
    line-height: 22px; text-shadow: 0 1px 6px rgba(23, 82, 165, .35);
  }
  .t1 {
    margin-top: 12px;
    font-size: 25px; font-weight: 800; letter-spacing: 2px;
    line-height: 26px; text-shadow: 0 2px 8px rgba(23, 82, 165, .35);
  }
  .t2 {
    margin-top: 7px;
    font-size: 21px; font-weight: 800; letter-spacing: 1.5px;
    line-height: 24px; text-shadow: 0 2px 8px rgba(23, 82, 165, .35);
  }
  .tag {
    margin-top: 12px;
    font-size: 13px; font-weight: 500; letter-spacing: 3px;
    line-height: 18px; opacity: .92;
    text-shadow: 0 1px 6px rgba(23, 82, 165, .3);
  }
  .tag-line {
    margin-top: 11px; width: 34px; height: 3px; border-radius: 2px;
    background: rgba(255, 255, 255, .95);
    box-shadow: 0 1px 4px rgba(23, 82, 165, .25);
  }

  /* ===== 表单卡片 ===== */
  .card {
    margin-top: auto;
    height: 356px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 18px 44px rgba(30, 80, 160, .14);
    padding: 24px 22px 18px;
    display: flex; flex-direction: column;
  }
  .frow {
    display: flex; align-items: center; gap: 13px;
    padding: 13px 2px; border-bottom: 1px solid var(--line);
  }
  .frow svg { flex: none; display: block; }
  .frow input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text); font-family: inherit; min-width: 0;
  }
  .frow input::placeholder { color: var(--faint); }
  .icon-btn { cursor: pointer; display: flex; }

  .remember {
    display: flex; align-items: center; gap: 8px;
    margin-top: 14px; font-size: 13px; color: var(--sub); cursor: pointer;
    user-select: none;
  }
  .radio {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid #C4CEDA; background: transparent;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .radio.on { border-color: var(--blue); }
  .radio .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); transform: scale(0); transition: transform .15s; }
  .radio.on .dot { transform: scale(1); }

  .btn {
    margin-top: 20px;
    height: 46px; width: 100%;
    border: none; border-radius: 23px; cursor: pointer;
    background: linear-gradient(135deg, #5C9CEF 0%, #3B7FE8 100%);
    color: #fff; font-size: 16px; font-weight: 600; font-family: inherit;
    letter-spacing: 8px; text-indent: 8px;
    box-shadow: 0 10px 22px rgba(59, 127, 232, .30);
    transition: transform .15s, box-shadow .15s, opacity .2s;
  }
  .btn:active { transform: scale(0.97); box-shadow: 0 5px 12px rgba(59, 127, 232, .26); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }

  .aux {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 15px; font-size: 13px;
  }
  .aux a { text-decoration: none; cursor: pointer; }
  .aux .sms { color: var(--blue); }
  .aux .forgot { color: #33475C; }

  .org {
    margin-top: auto;
    display: flex; flex-direction: column; gap: 9px; align-items: center;
  }
  .org p {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: #44566C; letter-spacing: .3px;
  }
  .org svg { flex: none; }

  /* toast */
  .toast {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(10, 22, 40, 0.88); color: #fff; font-size: 13px;
    padding: 9px 18px; border-radius: 100px; opacity: 0; pointer-events: none;
    transition: all .3s; white-space: nowrap; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="page" id="page-login">
    <div class="login-content">
      <div class="hero">
        <div class="hello">欢迎登录！</div>
        <div class="t1">南京南部新城</div>
        <div class="t2">公务用车一体化管理平台</div>
        <div class="tag">规范 · 高效 · 智慧 · 安全</div>
        <div class="tag-line"></div>
      </div>

      <div class="card">
        <div class="frow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="#8A94A6" stroke-width="1.6"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5" stroke="#8A94A6" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input type="text" id="account" placeholder="用户名/邮箱" autocomplete="off">
        </div>

        <div class="frow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="10.2" width="14" height="10" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><path d="M8.2 10V7.8a3.8 3.8 0 0 1 7.6 0V10" stroke="#8A94A6" stroke-width="1.6"/><circle cx="12" cy="15.2" r="1.5" fill="#8A94A6"/></svg>
          <input type="password" id="pwd" placeholder="请输入密码" autocomplete="off">
          <span class="icon-btn" onclick="togglePwd()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.9" stroke="#8A94A6" stroke-width="1.6"/><path d="M4.5 19.5 19.5 4.8" stroke="#8A94A6" stroke-width="1.6" stroke-linecap="round"/></svg>
          </span>
        </div>

        <div class="remember" onclick="toggleRemember()">
          <span class="radio off" id="rem-box"><span class="dot"></span></span>
          <span>记住密码</span>
        </div>

        <button type="button" class="btn" id="login-btn" onclick="handleLogin()">立即登录</button>

        <div class="aux">
          <a class="sms" onclick="toast('原型演示：短信登录暂未开放')">短信登录</a>
          <a class="forgot" onclick="toast('原型演示：请联系管理员重置密码')">忘记密码？</a>
        </div>

        <div class="org">
          <p>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="4" y="3.5" width="10" height="17" rx="1.2" stroke="#3D5A80" stroke-width="1.6"/><path d="M14 9h5a1 1 0 0 1 1 1v10.5h-6" stroke="#3D5A80" stroke-width="1.6"/><path d="M7.2 7.5h3.6M7.2 11h3.6M7.2 14.5h3.6" stroke="#3D5A80" stroke-width="1.5" stroke-linecap="round"/><path d="M3 20.5h18" stroke="#3D5A80" stroke-width="1.6" stroke-linecap="round"/></svg>
            主办：南京智慧新城工程管理有限公司
          </p>
          <p>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="#3D5A80" stroke-width="1.6"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8" stroke="#3D5A80" stroke-width="1.6" stroke-linecap="round"/></svg>
            技术：南京君竹人力资源管理有限公司
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  var REM_KEY = 'zp_remember_account';

  function togglePwd() {
    var pwd = document.getElementById('pwd');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }

  var remembered = false;
  function toggleRemember() {
    remembered = !remembered;
    document.getElementById('rem-box').classList.toggle('on', remembered);
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  function handleLogin() {
    var btn = document.getElementById('login-btn');
    var account = document.getElementById('account').value.trim();
    var pwd = document.getElementById('pwd').value.trim();

    if (!account) { toast('请输入用户名/邮箱'); return; }
    if (!pwd) { toast('请输入密码'); return; }

    try {
      if (remembered) localStorage.setItem(REM_KEY, account);
      else localStorage.removeItem(REM_KEY);
    } catch (e) {}

    btn.disabled = true;
    btn.textContent = '登录中...';
    setTimeout(function () {
      location.href = 'home.html';
    }, 600);
  }

  (function init() {
    try {
      var acc = localStorage.getItem(REM_KEY);
      if (acc) {
        document.getElementById('account').value = acc;
        remembered = true;
        document.getElementById('rem-box').classList.add('on');
      }
    } catch (e) {}
  })();

  document.getElementById('pwd').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') handleLogin();
  });
  document.getElementById('account').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('pwd').focus();
  });
</script>

</body>
</html>
