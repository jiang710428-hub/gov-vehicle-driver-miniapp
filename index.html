<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南京智慧新城 · 驾驶员端登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-deep: #001645;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --bg: #F9F9F9;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: #E8F1FA;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px;
    color: var(--text);
    overflow-y: auto;
  }

  .phone {
    width: 375px;
    max-width: 100%;
    height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative;
    overflow: hidden;
  }

  .notch, .statusbar { display: none; }

  .page {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: url('img/login-bg-final.jpg') no-repeat center top / cover;
  }

  .bg-mask {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 140% 55% at 50% 8%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0) 55%),
      linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.18) 100%);
  }

  .page > * { position: relative; z-index: 1; }

  .login-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 112px 32px 30px;
    overflow-y: auto; scrollbar-width: none;
  }
  .login-content::-webkit-scrollbar { display: none; }

  .brand {
    display: flex; flex-direction: column; align-items: center;
    gap: 9px;
  }
  .logo {
    width: 92px; height: 92px; border-radius: 24px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 14px 34px rgba(1, 77, 178, 0.22);
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .brand-title {
    font-size: 29px; font-weight: 800; color: #0A1628;
    letter-spacing: 1px; line-height: 1.1;
    text-shadow: 0 2px 8px rgba(255,255,255,.8);
  }
  .brand-sub {
    font-size: 15px; font-weight: 600; color: #0A1628;
    letter-spacing: .6px;
    text-shadow: 0 2px 8px rgba(255,255,255,.8);
  }
  .brand-badge {
    height: 30px; line-height: 30px; padding: 0 20px; border-radius: 15px;
    background: linear-gradient(90deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 14px; font-weight: 600;
    box-shadow: 0 6px 16px rgba(1, 77, 178, 0.28);
  }
  .brand-tag {
    margin-top: 5px; font-size: 12px; color: #5F6B7A; letter-spacing: 5.5px;
    text-shadow: 0 1px 6px rgba(255,255,255,.9);
  }

  .form-wrap {
    width: 100%; margin-top: 54px;
    background: rgba(255, 255, 255, .96);
    backdrop-filter: blur(6px);
    border-radius: 22px;
    padding: 22px 20px 20px;
    box-shadow: 0 14px 38px rgba(1, 77, 178, .12);
  }

  .form { display: flex; flex-direction: column; gap: 14px; }
  .field {
    height: 52px; border-radius: 14px; background: #F6F8FB;
    display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border: 1px solid #E8ECF2; transition: all .2s;
  }
  .field:focus-within {
    background: #fff; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(1,77,178,.10), 0 6px 18px rgba(1,77,178,.08);
  }
  .field:focus-within svg * { stroke: var(--primary); }
  .field:focus-within svg rect[fill="#8A94A6"],
  .field:focus-within svg circle[fill="#8A94A6"] { fill: var(--primary); }
  .field input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--text); font-family: inherit;
  }
  .field input::placeholder { color: var(--faint); }
  .field .icon-btn { cursor: pointer; display: flex; }

  .login-btn {
    height: 52px; border-radius: 26px; border: none; cursor: pointer; margin-top: 18px;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 17px; font-weight: 600;
    font-family: inherit; letter-spacing: 8px; text-indent: 8px;
    box-shadow: 0 12px 28px rgba(1, 77, 178, 0.32);
    transition: transform .15s, box-shadow .15s, opacity .2s;
  }
  .login-btn:active { transform: scale(0.97); box-shadow: 0 5px 14px rgba(1,77,178,.28); }
  .login-btn:disabled { opacity: 0.55; cursor: not-allowed; }

  .agree-row {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    margin-top: 16px; font-size: 12px; color: var(--muted);
    padding: 5px 14px; border-radius: 100px;
    background: rgba(255,255,255,0.62);
  }
  .agree-row a { color: var(--primary); text-decoration: none; }
  .checkbox {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    background: var(--primary); display: flex; align-items: center; justify-content: center;
    transition: background .15s, opacity .15s;
  }
  .checkbox.off { background: transparent; border: 1.5px solid #CBD5E1; }
  .checkbox.off svg { opacity: 0; }

  /* toast */
  .toast {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(10, 22, 40, 0.88); color: #fff; font-size: 13px;
    padding: 9px 18px; border-radius: 100px; opacity: 0; pointer-events: none;
    transition: all .3s; white-space: nowrap; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .slogan {
    margin-top: auto; align-self: flex-start;
    padding: 10px 16px 34px 10px;
    font-family: "STXingkai", "KaiTi", "SimKai", "Microsoft YaHei", serif;
    color: #1B5A9A;
    line-height: 1.35;
    transform: rotate(-4deg);
    text-shadow: 0 2px 8px rgba(255,255,255,.9);
    position: relative; z-index: 1;
    background: radial-gradient(ellipse 90% 90% at 35% 50%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 72%);
  }
  .slogan .line1 { font-size: 26px; letter-spacing: 2px; }
  .slogan .line2 { font-size: 26px; letter-spacing: 2px; margin-left: 22px; }
  .slogan .underline {
    position: absolute; left: 18px; bottom: 22px;
    width: 136px; height: 18px;
  }
  .slogan .underline path {
    fill: none; stroke: #2C8FDF; stroke-width: 1.6; stroke-linecap: round;
    opacity: .75;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="page" id="page-login">
    <div class="bg-mask"></div>
    <div class="login-content">
      <div class="brand">
        <div class="logo">
          <img src="img/logo.png" alt="南京智慧新城">
        </div>
        <div class="brand-title">南京智慧新城</div>
        <div class="brand-sub">公务用车一体化管理平台</div>
        <div class="brand-badge">驾驶员端</div>
        <div class="brand-tag">规范 · 高效 · 安全 · 智慧</div>
      </div>

      <div class="form-wrap">
        <form class="form" id="login-form" onsubmit="return handleLogin(event)">
          <div class="field">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><rect x="10.2" y="18" width="3.6" height="1.4" rx="0.7" fill="#8A94A6"/></svg>
            <input type="tel" id="phone" maxlength="11" placeholder="请输入手机号" autocomplete="off">
          </div>

          <div class="field">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5.5" y="10.5" width="13" height="9.5" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><rect x="10.6" y="5.4" width="2.8" height="5.6" rx="1.4" stroke="#8A94A6" stroke-width="1.6"/><circle cx="12" cy="15.2" r="1.5" fill="#8A94A6"/></svg>
            <input type="password" id="pwd" placeholder="请输入密码" autocomplete="off">
            <span class="icon-btn" onclick="togglePwd()">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" stroke="#8A94A6" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" stroke="#8A94A6" stroke-width="1.6"/></svg>
            </span>
          </div>

          <button type="submit" class="login-btn" id="login-btn">登 录</button>
        </form>
      </div>

      <div class="agree-row">
        <span class="checkbox off" id="agree-box" onclick="toggleAgree()">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4.5l3 3 5-6" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>我已阅读并同意</span><a href="agreement.html">《用户协议》</a><span>和</span><a href="privacy.html">《隐私协议》</a>
      </div>

      <div class="slogan">
        <div class="line1">智慧出行</div>
        <div class="line2">服务新城</div>
        <svg class="underline" viewBox="0 0 136 18" preserveAspectRatio="none"><path d="M4 12c28 4 66 6 104-2 14-3 22-6 24-8"/></svg>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  function togglePwd() {
    var pwd = document.getElementById('pwd');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
  }

  var agreed = false;

  function toggleAgree() {
    var box = document.getElementById('agree-box');
    agreed = !agreed;
    box.classList.toggle('off', !agreed);
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  function handleLogin(e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var phone = document.getElementById('phone').value.trim();
    var pwd = document.getElementById('pwd').value.trim();

    if (!phone || !pwd) { toast('请输入手机号和密码'); return false; }
    if (!/^1\d{10}$/.test(phone)) { toast('手机号格式不正确'); return false; }
    if (!agreed) { toast('请先勾选同意《用户协议》和《隐私协议》'); return false; }

    btn.disabled = true;
    btn.textContent = '登录中...';
    setTimeout(function () {
      location.href = 'home.html';
    }, 600);
    return false;
  }

  document.getElementById('pwd').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('login-form').dispatchEvent(new Event('submit', {cancelable: true}));
  });
</script>

</body>
</html>
