<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 维修保养记录编辑</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --amber: #D97706;
    --amber-d: #B45309;
    --amber-bg: #FFFBEB;
    --indigo: #4F46E5;
    --indigo-bg: #EEF2FF;
    --bg: #F7F8FA;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .fe-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* 导航栏 */
  .fe-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
  }
  .fe-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .fe-nav .back-btn:active { transform: scale(0.9); }
  .fe-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }

  .fe-body {
    flex: 1; overflow-y: auto; scrollbar-width: none;
    padding: 14px 16px 26px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .fe-body::-webkit-scrollbar { display: none; }

  /* 车辆上下文条 */
  .ctx-card {
    display: flex; align-items: center; gap: 11px;
    background: #fff; border-radius: 16px; padding: 12px 14px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .ctx-card .ctx-plate {
    width: 104px; height: 36px; border-radius: 9px; flex-shrink: 0;
    background: #0A1628; color: #fff;
    font-size: 13px; font-weight: 800; letter-spacing: 1.4px;
    display: flex; align-items: center; justify-content: center;
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
  }
  .ctx-card .ctx-m { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .ctx-card .ctx-t { font-size: 13.5px; font-weight: 800; }
  .ctx-card .ctx-s {
    font-size: 10.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  /* 类型标签（保养=琥珀 / 维修=靛蓝） */
  .ctx-tag {
    flex-shrink: 0; align-self: flex-start;
    font-size: 10.5px; font-weight: 700; border-radius: 100px; padding: 3.5px 10px;
    letter-spacing: .5px; white-space: nowrap;
  }
  .ctx-tag.mt { color: var(--amber-d); background: var(--amber-bg); }
  .ctx-tag.rp { color: var(--indigo); background: var(--indigo-bg); }

  /* 表单卡 */
  .f-card {
    background: #fff; border-radius: 16px; padding: 14px 15px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .f-head { display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
  .f-head .no {
    width: 20px; height: 20px; border-radius: 7px; flex-shrink: 0;
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .f-head .t { font-size: 14.5px; font-weight: 800; letter-spacing: .3px; }
  .f-head .sub { margin-left: auto; font-size: 10px; color: var(--faint); }
  .f-head .req { color: var(--red); }

  .field { margin-bottom: 11px; }
  .field:last-child { margin-bottom: 0; }
  .field .lab { font-size: 12px; font-weight: 700; color: var(--sub); margin-bottom: 6px; display: flex; align-items: center; gap: 3px; }
  .field .lab .req { color: var(--red); }
  .field .unit {
    display: inline-flex; align-items: center; margin-left: 6px;
    font-size: 10.5px; font-weight: 600; color: var(--muted);
    background: #F1F3F8; border-radius: 100px; padding: 1.5px 8px;
  }

  /* 选择器按钮 */
  .fp-btn {
    width: 100%; height: 46px; display: flex; align-items: center; gap: 9px;
    background: #F5F7FA; border: 1.5px solid #E4E9F1; border-radius: 13px;
    padding: 0 13px; cursor: pointer; font-family: inherit;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .fp-btn .fp-ic { flex-shrink: 0; width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; }
  .fp-btn .fp-tx { flex: 1; min-width: 0; text-align: left; }
  .fp-btn .fp-val { font-size: 14px; font-weight: 700; color: var(--text); }
  .fp-btn .fp-val.ph { color: var(--faint); font-weight: 500; }
  .fp-btn .fp-tip { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }
  .fp-btn svg { flex-shrink: 0; color: #A5AEBE; }
  .fp-btn.on { border-color: var(--primary); background: #F2F7FF; box-shadow: 0 0 0 3px rgba(1,77,178,.10); }
  .fp-btn:active { transform: scale(0.99); }

  /* 文本输入 */
  .txt-input {
    width: 100%; height: 44px; border-radius: 12px; outline: none;
    border: 1.5px solid #E4E9F1; background: #F5F7FA;
    padding: 0 13px; font-size: 14px; color: var(--text); font-family: inherit;
    transition: border-color .2s, background .2s, box-shadow .2s;
  }
  .txt-input::placeholder { color: #B4BDCC; }
  .txt-input:focus {
    border-color: var(--primary); background: #fff;
    box-shadow: 0 0 0 3px rgba(1, 77, 178, .12);
  }
  .txt-input.err { border-color: var(--red); background: #FFF5F5; }

  /* 金额输入 */
  .money { position: relative; }
  .money .cur {
    position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
    font-size: 14px; font-weight: 700; color: var(--sub);
    z-index: 1; pointer-events: none; font-family: Inter, sans-serif;
  }
  .money .txt-input { padding-left: 30px; }

  .two-col { display: flex; gap: 10px; }
  .two-col .field { flex: 1; min-width: 0; }

  /* 图片上传 */
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
  .photo-cell {
    aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; position: relative;
    border: 1.5px dashed #CBD5E1; background: #F0F2F7; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .2s;
  }
  .photo-cell:active { transform: scale(0.97); }
  .photo-cell .ph { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); }
  .photo-cell .ph .cam-box {
    width: 36px; height: 36px; border-radius: 12px;
    background: linear-gradient(135deg, #EFF6FF, #DCECFB); border: 1px solid #D6E6FA;
    display: flex; align-items: center; justify-content: center;
  }
  .photo-cell .ph .txt { font-size: 10px; font-weight: 600; color: var(--sub); }
  .photo-cell.has { border-style: solid; border-color: #C6D2E4; }
  .photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-cell .del {
    position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%;
    border: none; cursor: pointer; background: rgba(10, 22, 40, .62); color: #fff;
    font-size: 11px; line-height: 20px; display: none; text-align: center; padding: 0;
  }
  .photo-cell.has .del { display: block; }
  .photo-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
  }
  .photo-count { font-size: 11px; color: var(--muted); }
  .photo-count b { color: var(--primary); }
  .demo-link {
    border: none; background: none; cursor: pointer; color: var(--primary);
    font-size: 11px; font-weight: 700; font-family: inherit;
  }

  /* 记录人（只读行） */
  .ro { display: flex; align-items: center; gap: 9px; padding: 9px 2px; }
  .ro + .ro { border-top: 1px solid var(--line); }
  .ro .rk { font-size: 12px; color: var(--muted); width: 76px; flex-shrink: 0; }
  .ro .rv { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .ro .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .ro .rv .nm { font-size: 14px; font-weight: 700; }
  .ro .rv .no-mono {
    font-size: 14px; font-weight: 700; color: var(--primary);
    font-family: Inter, "Sarasa Gothic SC", sans-serif; letter-spacing: .8px;
  }
  .auto-tag {
    margin-left: auto; flex-shrink: 0;
    font-size: 10px; font-weight: 700; color: var(--primary);
    background: var(--blue-bg); border-radius: 100px; padding: 3px 9px;
  }

  /* 提交与删除 */
  .submit-btn {
    width: 100%; height: 50px; border: none; border-radius: 14px; cursor: pointer;
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 100%);
    color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 2px;
    font-family: inherit;
    box-shadow: 0 10px 22px rgba(1, 77, 178, 0.32);
    transition: transform .15s, opacity .2s;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { background: #C9D4E3; box-shadow: none; cursor: not-allowed; }
  /* 底部保存栏 */
  .save-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    padding: 10px 16px 14px;
    background: rgba(255, 255, 255, .97);
    border-top: 1px solid var(--line);
    box-shadow: 0 -6px 18px rgba(15, 42, 86, .05);
  }
  .save-bar .submit-btn { flex: 1; }
  .save-bar .bar-del {
    width: 92px; height: 50px; flex-shrink: 0; border-radius: 14px;
    border: 1.5px solid #FECACA; background: #FFF5F5; color: var(--red);
    font-size: 15px; font-weight: 700; font-family: inherit; letter-spacing: 1px;
    cursor: pointer; transition: transform .15s;
  }
  .save-bar .bar-del:active { transform: scale(0.98); }

  /* ===== 底部弹层 ===== */
  .mask {
    position: absolute; inset: 0; background: rgba(7, 15, 30, 0.55);
    opacity: 0; pointer-events: none; transition: opacity .28s; z-index: 300;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 310;
    background: #fff; border-radius: 22px 22px 0 0;
    transform: translateY(105%); transition: transform .32s cubic-bezier(.32, .72, .28, 1);
    box-shadow: 0 -12px 40px rgba(7, 15, 30, 0.18);
    display: flex; flex-direction: column; max-height: 70%;
    padding-bottom: 18px;
  }
  .sheet.show { transform: translateY(0); }
  .sh-handle { height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .sh-handle::before { content: ''; width: 38px; height: 4px; border-radius: 2px; background: #E2E7EE; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 18px 12px; }
  .sh-head .t { font-size: 17px; font-weight: 800; }
  .sh-head .sh-x {
    width: 28px; height: 28px; border-radius: 50%; border: none; background: #F0F2F7;
    cursor: pointer; color: var(--muted); font-size: 13px; line-height: 28px; text-align: center;
  }
  .sh-body { overflow-y: auto; padding: 0 18px; display: flex; flex-direction: column; gap: 13px; }

  /* 日历 */
  .cal-card { background: #F7F9FC; border-radius: 16px; padding: 12px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav button {
    width: 30px; height: 30px; border-radius: 9px; border: none; background: #fff;
    cursor: pointer; color: var(--text); font-size: 16px; font-weight: 700;
    box-shadow: 0 1px 4px rgba(15,42,86,.08);
  }
  .cal-nav button:disabled { color: #C6CFDC; background: #F1F3F7; cursor: not-allowed; }
  .cal-nav .cal-t { font-size: 14.5px; font-weight: 800; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-week span {
    text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 600;
    padding: 4px 0;
  }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid button {
    height: 34px; border-radius: 10px; border: none; background: transparent;
    font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .cal-grid button.out, .cal-grid button.off { color: #C6CFDC; }
  .cal-grid button.off { cursor: not-allowed; }
  .cal-grid button:not(.out):not(.off):hover { background: #E9F0FB; }
  .cal-grid button.sel {
    background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff;
    box-shadow: 0 4px 10px rgba(1,77,178,.30);
  }
  .cal-grid button.today:not(.sel) {
    color: var(--primary); font-weight: 800;
    box-shadow: inset 0 0 0 1.5px var(--primary);
  }
  .cal-note { font-size: 10.5px; color: var(--faint); text-align: center; padding-top: 2px; }

  /* 删除确认 */
  .cf-ic {
    width: 56px; height: 56px; margin: 6px auto 12px; border-radius: 50%;
    background: var(--red-bg); color: var(--red);
    display: flex; align-items: center; justify-content: center;
  }
  .cf-t { font-size: 16px; font-weight: 800; text-align: center; }
  .cf-s { font-size: 12px; color: var(--muted); text-align: center; margin: 8px 0 4px; line-height: 1.7; }
  .cf-ops { display: flex; gap: 10px; margin-top: 14px; }
  .cf-ops button {
    flex: 1; height: 46px; border-radius: 13px; cursor: pointer;
    font-size: 15px; font-weight: 700; font-family: inherit; letter-spacing: 1px;
    transition: transform .15s;
  }
  .cf-ops button:active { transform: scale(0.97); }
  .cf-ops .cf-no { border: 1px solid #DCE2EC; background: #fff; color: var(--sub); }
  .cf-ops .cf-yes { border: none; background: linear-gradient(135deg, #F87171, #DC2626); color: #fff; }

  /* toast */
  .toast {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(16px);
    background: rgba(10, 22, 40, .9); color: #fff;
    padding: 9px 18px; border-radius: 100px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 400;
    white-space: nowrap; max-width: 320px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="page">
      <div class="statusbar">
        <span class="time">10:24</span>
        <span class="capsule"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      </div>

      <div class="fe-content">
        <div class="fe-nav">
          <button class="back-btn" onclick="goBack()" aria-label="返回">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#0A1628" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <span class="title" id="pageTitle">新增保养记录</span>
        </div>

        <div class="fe-body">
          <!-- 车辆上下文 -->
          <div class="ctx-card">
            <span class="ctx-plate" id="plateChip">--</span>
            <span class="ctx-m">
              <span class="ctx-t" id="ctxTitle">新增保养记录</span>
              <span class="ctx-s" id="ctxSub">为该车添加一条保养记录</span>
            </span>
            <span class="ctx-tag mt" id="typeTag">保养</span>
          </div>

          <!-- ① 记录信息 -->
          <div class="f-card">
            <div class="f-head"><span class="no">1</span><span class="t" id="cardTitle">保养信息</span><span class="sub"><span class="req">*</span> 必填</span></div>

            <div class="field">
              <div class="lab" id="dateLab">保养日期<span class="req">*</span></div>
              <button type="button" class="fp-btn on" id="dateBtn" onclick="openDate()">
                <span class="fp-ic" style="background:#EFF6FF">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="#014DB2" stroke-width="1.7"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="#014DB2" stroke-width="1.7" stroke-linecap="round"/></svg>
                </span>
                <span class="fp-tx"><span class="fp-val" id="dateVal">--</span><span class="fp-tip">仅可选择今天及以前日期</span></span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>

            <div class="field" id="kmField">
              <div class="lab">保养公里数<span class="req">*</span><span class="unit">行驶里程</span></div>
              <input class="txt-input" id="kmInput" inputmode="numeric" maxlength="7" placeholder="如：45230">
            </div>

            <div class="field">
              <div class="lab" id="itemLab">保养项目<span class="req">*</span></div>
              <input class="txt-input" id="itemInput" maxlength="40" placeholder="如：更换机油机滤、空调滤芯">
            </div>

            <div class="field" id="costField">
              <div class="lab">费用<span class="req">*</span></div>
              <div class="money">
                <span class="cur">¥</span>
                <input class="txt-input" id="costInput" inputmode="decimal" maxlength="9" placeholder="0.00">
              </div>
            </div>

            <div class="field" id="nextField" style="margin-bottom:0">
              <div class="lab">下次保养日期<span class="req">*</span></div>
              <button type="button" class="fp-btn" id="nextBtn" onclick="openNext()">
                <span class="fp-ic" style="background:#EEF2FF">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" stroke="#4F46E5" stroke-width="1.7"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round"/><circle cx="17" cy="16.5" r="2.6" stroke="#4F46E5" stroke-width="1.7"/><path d="M17 15.2v1.5l1 .9" stroke="#4F46E5" stroke-width="1.6" stroke-linecap="round"/></svg>
                </span>
                <span class="fp-tx"><span class="fp-val ph" id="nextVal">请选择</span><span class="fp-tip">需晚于本次保养日期 · 建议按保养周期设置</span></span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>

          <!-- ② 凭证照片 -->
          <div class="f-card">
            <div class="f-head"><span class="no">2</span><span class="t" id="photoT">保养凭证</span><span class="sub">至少 1 张 · 最多 9 张</span></div>
            <div class="photo-grid" id="photoGrid">
              <div class="photo-cell" id="addCell" onclick="document.getElementById('photoFile').click()">
                <div class="ph">

    <!-- 弹层：保养/维修日期（今天及以前） -->

    <div class="sheet" id="sheetNext">
      <div class="sh-handle"></div>
      <div class="sh-head">
        <span class="t">选择下次保养日期</span>
        <button class="sh-x" onclick="closeSheet()">✕</button>
      </div>
      <div class="sh-body">
        <div class="cal-card">
          <div class="cal-nav">
            <button type="button" id="calPrevN" onclick="calNav(-1)">‹</button>
            <span class="cal-t" id="calTitleN">2026年10月</span>
            <button type="button" id="calNextN" onclick="calNav(1)">›</button>
          </div>
          <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
          <div class="cal-grid" id="calGridN"></div>
        </div>
        <div class="cal-note">下次保养日期需晚于本次保养日期 · 灰显日期不可选</div>
      </div>

    <!-- 弹层：删除确认 -->
    <div class="sheet" id="delSheet">
      <div class="sh-handle"></div>
      <div class="sh-body">
        <div class="cf-ic">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9.5 7V5.5A1.5 1.5 0 0 1 11 4h2a1.5 1.5 0 0 1 1.5 1.5V7M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4l.8-12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="cf-t" id="delTitle">删除这条保养记录？</div>
        <div class="cf-s" id="delInfo"></div>
        <div class="cf-ops">
          <button class="cf-no" onclick="closeSheet()">取消</button>
          <button class="cf-yes" onclick="doDelete()">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var KEY = 'zp_maintain_list';
  /* 当前登录驾驶员（演示固定：张三） */
  var ME = { name: '张三', no: '10086' };

  var editId = null;      /* null = 新增 */
  var curRec = null;      /* 编辑模式当前记录 */
  var recType = 'maintain';  /* maintain 保养 / repair 维修 */
  var PLATE = qs('plate');
  var selDate = todayStr();
  var nextDate = '';      /* 保养专用：下次保养日期 */
  var km = '';
  var item = '';
  var cost = '';
  var photos = [];
  var MAX_PHOTOS = 9;
  var CAL = { y: 0, m: 0, mode: 'date' };

  /* ========== 工具 ========== */
  function byId(id) { return document.getElementById(id); }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function parseDate(s) { var a = s.split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
  function dstr(d) { return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
  function addDays(ds, n) { var d = parseDate(ds); return dstr(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); }
  function weekText(d) { return '周' + '日一二三四五六'[d.getDay()]; }
  function todayStr() { return dstr(new Date()); }
  function dateText(ds) { var d = parseDate(ds); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekText(d); }
  function tName(t) { return t === 'repair' ? '维修' : '保养'; }
  function isMaintain() { return recType !== 'repair'; }
  function codePre() { return recType === 'repair' ? 'WX' : 'BY'; }
  function isMine(r) { return r.driverName === ME.name && r.driverNo === ME.no; }

  function qs(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
    if (!m) return '';
    try { return decodeURIComponent(m[1]); } catch (e) { return m[1]; }
  }

  function load() {
    try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function save(list) { localStorage.setItem(KEY, JSON.stringify(list)); }

  /* ===== 记录编号 / 创建时间 =====
     编号：保养 BY / 维修 WX + 创建日(YYYYMMDD) + 当日流水(2 位自 01)，
     新增时自动生成并固定（编辑不改号）；创建时间精确到秒 */
  function nowStr() {
    var d = new Date();
    return dstr(d) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }
  function ensureMeta(list) {
    var changed = false;
    var max = {};
    list.forEach(function (x) {
      if (!x.createdAt) {
        var i = list.indexOf(x);
        var dd = x.date || todayStr();
        var hh = p2(8 + (i * 3) % 10), mi = p2((i * 13) % 60), ss = p2((i * 29) % 60);
        x.createdAt = dd + ' ' + hh + ':' + mi + ':' + ss;
        changed = true;
      }
    });
    list.forEach(function (x) {
      var m = /^(BY|WX)(\d{8})-(\d{2})$/.exec(x.code || '');
      if (m) { var k = m[1] + m[2]; max[k] = Math.max(max[k] || 0, +m[3]); }
    });
    list.forEach(function (x) {
      if (x.code) return;
      var pre = x.type === 'repair' ? 'WX' : 'BY';
      var day = (x.createdAt || todayStr()).slice(0, 10).replace(/-/g, '');
      var k = pre + day;
      var n = (max[k] || 0) + 1; max[k] = n;
      x.code = pre + day + '-' + p2(n);
      changed = true;
    });
    return changed;
  }
  function genNewCode(list, pre) {
    var d = new Date();
    var day = '' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate());
    var re = new RegExp('^' + pre + '(\\d{8})-(\\d{2})$');
    var max = 0;
    list.forEach(function (x) {
      var m = re.exec(x.code || '');
      if (m && m[1] === day) max = Math.max(max, +m[2]);
    });
    return pre + day + '-' + p2(max + 1);
  }

  /* ========== toast ========== */
  var toastTimer = null;
  function toast(msg) {
    var el = byId('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  /* ========== 弹层 ========== */
  function showSheet(id) { byId(id).classList.add('show'); byId('mask').classList.add('show'); }
  function closeSheet() {
    ['sheetDate', 'sheetNext', 'delSheet'].forEach(function (id) {
      byId(id).classList.remove('show');
    });
    byId('mask').classList.remove('show');
  }
  /* 点击遮罩：关闭所有弹层 */
  function onMask() { closeSheet(); }

  /* ========== 日历 ========== */
  function openDate() {
    var d = parseDate(selDate || todayStr());
    CAL = { y: d.getFullYear(), m: d.getMonth(), mode: 'date' };
    buildCal();
    showSheet('sheetDate');
  }
  function openNext() {
    var base = nextDate ? parseDate(nextDate) : parseDate(addDays(selDate || todayStr(), 1));
    CAL = { y: base.getFullYear(), m: base.getMonth(), mode: 'next' };
    buildCal();
    showSheet('sheetNext');
  }
  function calNav(delta) {
    var c = CAL;
    var now = new Date();
    if (c.mode === 'date') {
      /* 保养/维修日期：不允许翻到未来月份 */
      if (delta > 0 && c.y === now.getFullYear() && c.m === now.getMonth()) return;
    } else {
      /* 下次保养日期：不允许翻到保养日期所在月之前 */
      var s = parseDate(selDate || todayStr());
      if (delta < 0 && c.y === s.getFullYear() && c.m <= s.getMonth()) return;
    }
    c.m += delta;
    if (c.m < 0) { c.m = 11; c.y--; }
    if (c.m > 11) { c.m = 0; c.y++; }
    buildCal();
  }
  function buildCal() {
    var next = CAL.mode === 'next';
    var now = new Date();
    var tStr = todayStr();
    var sStr = selDate || tStr;
    var titleEl = byId(next ? 'calTitleN' : 'calTitle');
    var gridEl = byId(next ? 'calGridN' : 'calGrid');
    var prevEl = byId(next ? 'calPrevN' : 'calPrev');
    var nextEl = byId(next ? 'calNextN' : 'calNext');
    var s = parseDate(sStr);

    titleEl.textContent = CAL.y + '年' + (CAL.m + 1) + '月';
    var first = new Date(CAL.y, CAL.m, 1);
    var startDow = first.getDay();
    var dim = new Date(CAL.y, CAL.m + 1, 0).getDate();
    var prevDim = new Date(CAL.y, CAL.m, 0).getDate();
    var h = '';
    for (var i = 0; i < 42; i++) {
      var cell = i - startDow + 1;
      var d, out;
      if (cell < 1) { d = prevDim + cell; out = true; }
      else if (cell > dim) { d = cell - dim; out = true; }
      else { d = cell; out = false; }
      var y = CAL.y, m = CAL.m;
      if (out && cell < 1) { m = CAL.m - 1; if (m < 0) { m = 11; y--; } }
      if (out && cell > dim) { m = CAL.m + 1; if (m > 11) { m = 0; y++; } }
      var ds = y + '-' + p2(m + 1) + '-' + p2(d);
      var cls = out ? 'out' : '';
      var off = false;
      if (!out) {
        if (next) off = ds <= sStr;                 /* 下次保养：需晚于保养日期 */
        else off = ds > tStr;                       /* 保养/维修日期：仅今天及以前 */
      }
      if (off) cls += ' off';
      if (!out && !off) {
        if (next) { if (ds === nextDate) cls += ' sel'; }
        else {
          if (ds === selDate) cls += ' sel';
          else if (ds === tStr) cls += ' today';
        }
      }
      var fn = next ? 'pickNext' : 'pickDate';
      h += '<button type="button" class="' + cls + '"' +
        (!out && !off ? ' onclick="' + fn + '(\'' + ds + '\')"' : '') + '>' + d + '</button>';
    }
    gridEl.innerHTML = h;
    /* 导航按钮边界 */
    if (next) prevEl.disabled = (CAL.y === s.getFullYear() && CAL.m <= s.getMonth());
    else prevEl.disabled = false;
    nextEl.disabled = next ? false : (CAL.y === now.getFullYear() && CAL.m === now.getMonth());
  }
  function pickDate(ds) {
    if (ds > todayStr()) { toast('不能选择未来日期'); return; }
    selDate = ds;
    byId('dateVal').textContent = dateText(ds);
    byId('dateVal').classList.remove('ph');
    byId('dateBtn').classList.add('on');
    closeSheet();
  }
  function pickNext(ds) {
    if (ds <= selDate) { toast('下次保养日期需晚于保养日期'); return; }
    nextDate = ds;
    var v = byId('nextVal');
    v.textContent = dateText(ds);
    v.classList.remove('ph');
    byId('nextBtn').classList.add('on');
    closeSheet();
  }

  /* ========== 图片 ========== */
  function demoImg(k) {
    var colors = [
      { bg: '#EEF2FF', c1: '#4F46E5', c2: '#C7D2FE' },
      { bg: '#FFFBEB', c1: '#B45309', c2: '#FDE68A' },
      { bg: '#EAF1FC', c1: '#014DB2', c2: '#B9D2F0' }
    ];
    var c = colors[k % colors.length];
    var s = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='240'>" +
      "<rect width='320' height='240' rx='16' fill='" + c.bg + "'/>" +
      "<rect x='20' y='20' width='280' height='200' rx='12' fill='#fff' opacity='.9'/>" +
      "<rect x='40' y='44' width='90' height='16' rx='8' fill='" + c.c1 + "'/>" +
      "<rect x='140' y='44' width='130' height='16' rx='8' fill='" + c.c2 + "' opacity='.8'/>" +
      "<rect x='40' y='74' width='240' height='8' rx='4' fill='" + c.c2 + "'/>" +
      "<rect x='40' y='92' width='200' height='8' rx='4' fill='" + c.c2 + "'/>" +
      "<rect x='40' y='126' width='160' height='12' rx='6' fill='" + c.c1 + "' opacity='.8'/>" +
      "<rect x='40' y='158' width='110' height='34' rx='17' fill='" + c.c1 + "'/>" +
      "<rect x='170' y='158' width='110' height='34' rx='17' fill='" + c.c2 + "' opacity='.75'/>" +
      "</svg>";
    return 'data:image/svg+xml,' + encodeURIComponent(s);
  }
  function addDemoPhoto() {
    if (photos.length >= MAX_PHOTOS) { toast('最多上传 ' + MAX_PHOTOS + ' 张照片'); return; }
    photos.push(demoImg(photos.length));
    renderPhotos();
  }
  function onPhoto(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    if (photos.length >= MAX_PHOTOS) { toast('最多上传 ' + MAX_PHOTOS + ' 张照片'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      photos.push(e.target.result);
      renderPhotos();
      input.value = '';
    };
    reader.readAsDataURL(file);
  }
  function removePhoto(i) {
    photos.splice(i, 1);
    renderPhotos();
  }
  function renderPhotos() {
    var grid = byId('photoGrid');
    grid.innerHTML = '';
    photos.forEach(function (src, i) {
      var cell = document.createElement('div');
      cell.className = 'photo-cell has';
      cell.innerHTML =
        '<img src="' + src + '" alt="凭证照片' + (i + 1) + '">' +
        '<button class="del" onclick="event.stopPropagation();removePhoto(' + i + ')">✕</button>';
      grid.appendChild(cell);
    });
    if (photos.length < MAX_PHOTOS) {
      var add = document.createElement('div');
      add.className = 'photo-cell';
      add.id = 'addCell';
      add.onclick = function () { byId('photoFile').click(); };
      add.innerHTML =
        '<div class="ph"><div class="cam-box">' +
        '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="#014DB2" stroke-width="1.6"/></svg>' +
        '</div><span class="txt">拍摄 / 相册</span></div>';
      grid.appendChild(add);
    }
    byId('photoNum').textContent = photos.length;
  }

  /* ========== 校验错误标记 ========== */
  function markErr(id) {
    var el = byId(id);
    el.classList.add('err');
    setTimeout(function () { el.classList.remove('err'); }, 1800);
  }

  /* ========== 页面上下文（按类型） ========== */
  function typeLabel() { return tName(recType); }

  function applyTypeUI() {
    var m = isMaintain();
    var t = typeLabel();
    byId('pageTitle').textContent = (editId ? '编辑' : '新增') + t + '记录';
    /* 车辆上下文：ctx 车牌 chip 随 PLATE 回填（编辑态由记录反推，新增态来自 ?plate=） */
    byId('plateChip').textContent = PLATE;
    byId('ctxTitle').textContent = (editId ? '编辑' : '新增') + t + '记录';
    byId('ctxSub').textContent = editId
      ? '记录编号 ' + (curRec && curRec.code ? curRec.code : '--')
      : '为该车添加一条' + t + '记录';
    byId('dateLab').innerHTML = t + '日期<span class="req">*</span>';
    byId('dateSheetT').textContent = '选择' + t + '日期';
    byId('cardTitle').textContent = t + '信息';
    byId('itemLab').innerHTML = t + '项目<span class="req">*</span>';
    byId('itemInput').placeholder = m ? '如：更换机油机滤、空调滤芯' : '如：更换前轮刹车片';
    byId('photoT').textContent = m ? '保养凭证' : '维修凭证';
    var tag = byId('typeTag');
    tag.className = 'ctx-tag ' + (m ? 'mt' : 'rp');
    tag.textContent = t;
    /* 保养：公里数 + 下次保养日期；维修：隐藏 */
    byId('kmField').style.display = m ? '' : 'none';
    byId('nextField').style.display = m ? '' : 'none';
  }

  /* ========== 载入 / 保存 ========== */
  function parseQuery() {
    var q = location.search;
    if (q.indexOf('id=') < 0) return null;
    return decodeURIComponent(q.split('id=')[1].split('&')[0]);
  }

  function initForm() {
    /* 类型：优先取记录本身 / type 参数 */
    var qid = parseQuery();
    var qtype = qs('type');
    if (qtype === 'maintain' || qtype === 'repair') recType = qtype;
    if (!recType) recType = 'maintain';

    byId('dateVal').textContent = dateText(selDate);
    byId('dateBtn').classList.add('on');
    renderPhotos();

    if (!qid) {
      /* 新增模式：需车辆参数；无参直开（如预览）回退演示车 */
      if (!PLATE) PLATE = '苏A·12345';
      applyTypeUI();
      return;
    }

    /* 编辑模式 */
    var list = load();
    if (ensureMeta(list)) save(list);
    var rec = null;
    list.forEach(function (x) { if (x.id === qid) rec = x; });
    if (!rec) {
      toast('未找到该记录');
      setTimeout(function () { if (PLATE) location.href = 'maintain-records.html?plate=' + encodeURIComponent(PLATE); else location.href = 'vehicles.html'; }, 900);
      return;
    }
    if (!isMine(rec)) {
      toast('仅可修改自己创建的记录');
      setTimeout(function () { location.href = 'maintain-records.html?plate=' + encodeURIComponent(rec.plate); }, 900);
      return;
    }
    editId = qid;
    curRec = rec;
    PLATE = rec.plate;
    recType = rec.type || 'maintain';
    selDate = rec.date || todayStr();
    nextDate = rec.nextDate || '';
    km = rec.km != null ? String(rec.km) : '';
    item = rec.item || '';
    cost = rec.cost != null ? String(rec.cost) : '';

    byId('saveBtn').textContent = '保存修改';
    byId('delBarBtn').style.display = 'block';
    byId('delTitle').textContent = '删除这条' + typeLabel() + '记录？';
    byId('delInfo').textContent = (rec.date || '') + ' · ' + (rec.item || '') + ' · ¥' + (rec.cost || '');

    byId('dateVal').textContent = dateText(selDate);
    byId('kmInput').value = km;
    byId('itemInput').value = item;
    byId('costInput').value = cost;
    if (nextDate) {
      var nv = byId('nextVal');
      nv.textContent = dateText(nextDate);
      nv.classList.remove('ph');
      byId('nextBtn').classList.add('on');
    }
    photos = (rec.photos || []).slice();
    renderPhotos();
    applyTypeUI();
  }

  function saveRec() {
    var m = isMaintain();
    var t = typeLabel();
    var itemV = byId('itemInput').value.trim();
    var costV = byId('costInput').value.trim();
    var kmV = m ? byId('kmInput').value.trim() : '';

    if (!selDate) { toast('请选择' + t + '日期'); return; }
    if (m && !kmV) { toast('请填写保养公里数'); markErr('kmInput'); return; }
    if (m && !/^\d+$/.test(kmV)) { toast('保养公里数需为整数'); markErr('kmInput'); return; }
    if (!itemV) { toast('请填写' + t + '项目'); markErr('itemInput'); return; }
    if (!costV) { toast('请填写费用'); markErr('costInput'); return; }
    if (!/^\d+(\.\d{1,2})?$/.test(costV) || Number(costV) <= 0) {
      toast('费用需为大于 0 的数字'); markErr('costInput'); return;
    }
    if (m && !nextDate) { toast('请选择下次保养日期'); return; }
    if (m && nextDate <= selDate) {
      toast('下次保养日期需晚于保养日期'); return;
    }
    if (!photos.length) { toast('请至少上传 1 张凭证照片'); return; }

    var list = load();
    if (ensureMeta(list)) { /* 旧数据补齐后随本次一并落库 */ }
    var newCode = null;
    if (editId) {
      list.forEach(function (x) {
        if (x.id === editId) {
          x.type = recType;
          x.plate = PLATE;
          x.date = selDate;
          x.item = itemV;
          x.cost = costV;
          x.photos = photos.slice();
          if (m) { x.km = kmV; x.nextDate = nextDate; }
          else { delete x.km; delete x.nextDate; }
          /* 记录编号 / 创建时间一经生成固定不变 */
        }
      });
    } else {
      var pre = codePre();
      newCode = genNewCode(list, pre);
      var obj = {
        id: 'M' + Date.now() + Math.floor(Math.random() * 90 + 10),
        type: recType,
        code: newCode,
        createdAt: nowStr(),
        plate: PLATE,
        date: selDate,
        item: itemV,
        cost: costV,
        photos: photos.slice(),
        driverName: ME.name,
        driverNo: ME.no
      };
      if (m) { obj.km = kmV; obj.nextDate = nextDate; }
      list.push(obj);
    }
    save(list);

    var btn = byId('saveBtn');
    btn.disabled = true;
    btn.textContent = editId ? '修改成功 ✓' : '新增成功 ✓';
    toast(editId
      ? t + '记录修改成功'
      : newCode ? t + '记录新增成功 · 编号 ' + newCode : t + '记录新增成功');
    setTimeout(function () { location.href = 'maintain-records.html?plate=' + encodeURIComponent(PLATE); }, 900);
  }

  /* ========== 删除 ========== */
  function askDel() { showSheet('delSheet'); }
  function doDelete() {
    var list = load().filter(function (x) { return x.id !== editId; });
    save(list);
    closeSheet();
    toast('维修保养记录已删除');
    setTimeout(function () { location.href = 'maintain-records.html?plate=' + encodeURIComponent(PLATE); }, 700);
  }

  /* ========== 返回 ========== */
  function goBack() {
    /* 编辑页从维修保养记录列表进入：直接返回对应车辆记录列表，不依赖历史栈 */
    if (PLATE) { location.href = 'maintain-records.html?plate=' + encodeURIComponent(PLATE); return; }
    if (window.history && history.length > 1) { history.back(); return; }
    location.href = 'vehicles.html';
  }

  /* ========== 启动 ========== */
  initForm();
</script>
</body>
</html>
