<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 我的</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-2: #047857;
    --green-bg: #ECFDF5;
    --amber: #F59E0B;
    --red: #EF4444;
    --bg: #F7F8FA;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  /* ===== 页面顶部渐变背景（与首页 hero / 工作记录同源） ===== */
  .my-top {
    flex-shrink: 0; position: relative; overflow: visible;
    background: linear-gradient(135deg, #1A6FE0 0%, #0A4FB8 52%, #001645 100%);
    color: #fff;
  }
  .my-top::before {
    content: ''; position: absolute; right: -52px; top: -78px;
    width: 200px; height: 200px; border-radius: 50%;
    border: 26px solid rgba(255,255,255,.05); pointer-events: none;
  }
  .my-top::after {
    content: ''; position: absolute; left: -64px; top: 118px;
    width: 150px; height: 150px; border-radius: 50%;
    border: 18px solid rgba(255,255,255,.04); pointer-events: none;
  }
  .my-top .time { color: #fff; }
  .my-head {
    position: relative; z-index: 1;
    display: flex; align-items: flex-end; justify-content: space-between;
    padding: 2px 22px 0;
  }
  .my-head .tt { font-size: 21px; font-weight: 800; letter-spacing: .5px; line-height: 1.25; }

  /* 个人信息卡（叠在渐变区底部，轻微下压到灰底） */
  .profile-wrap { position: relative; z-index: 2; padding: 10px 16px 0; }
  .profile {
    background: #fff; border-radius: 18px; padding: 16px;
    box-shadow: 0 12px 26px rgba(1, 77, 178, 0.18);
    transform: translateY(16px);
  }
  .p-top { display: flex; align-items: center; gap: 13px; }
  .p-avatar {
    width: 62px; height: 62px; border-radius: 20px; flex-shrink: 0;
    background: linear-gradient(135deg, #93C5FD 0%, #3B7FE8 60%, #1E5BC6 100%);
    border: 2.5px solid #fff;
    box-shadow: 0 6px 16px rgba(0,0,0,.20);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .p-main { flex: 1; min-width: 0; }
  .p-name-row { display: flex; align-items: center; gap: 8px; }
  .p-name { font-size: 19px; font-weight: 800; letter-spacing: .3px; color: var(--text); }
  .p-status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; color: var(--green-2);
    background: var(--green-bg); border-radius: 100px; padding: 3px 9px;
    border: 1px solid #A7F3D0;
  }
  .p-status i {
    width: 5px; height: 5px; border-radius: 50%; background: var(--green);
    box-shadow: 0 0 0 2px rgba(16,185,129,.25); flex-shrink: 0;
  }
  .p-sub { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .p-tel {
    display: inline-flex; align-items: center; gap: 5px;
    margin-top: 4px; font-size: 12px; color: var(--muted);
  }
  .p-meta {
    display: flex; margin-top: 13px; padding-top: 13px;
    border-top: 1px dashed #E5EAF3;
  }
  .p-meta .mi { flex: 1; min-width: 0; }
  .p-meta .mi + .mi { border-left: 1px solid #EFF2F7; padding-left: 14px; }
  .p-meta .mi .k { display: block; font-size: 10.5px; color: var(--faint); letter-spacing: .4px; }
  .p-meta .mi .v {
    display: block; margin-top: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .my-body {
    flex: 1; position: relative; z-index: 1;
    padding: 34px 16px 18px; display: flex; flex-direction: column; gap: 12px;
    overflow-y: auto; scrollbar-width: none;
  }
  .my-body::-webkit-scrollbar { display: none; }

  /* 分组卡 */
  .grp {
    background: #fff; border-radius: 16px; padding: 6px 0;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .grp-h {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 16px 2px; font-size: 14.5px; font-weight: 700;
  }
  .grp-h .tick {
    width: 4px; height: 14px; border-radius: 2px;
    background: linear-gradient(180deg, #0A5FD4, #014DB2);
  }
  .grp-h .g-note { margin-left: auto; font-size: 10.5px; color: var(--faint); font-weight: 500; }

  /* 功能行 */
  .row-cell {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer;
    transition: background .15s;
  }
  .row-cell:active { background: #F6F8FC; }
  .row-cell:active .arrow { background: var(--primary); color: #fff; }
  .rc-icon {
    width: 42px; height: 42px; border-radius: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .rc-icon.blue { background: linear-gradient(135deg, #EAF3FF 0%, #DCE9FC 100%); }
  .rc-icon.green { background: linear-gradient(135deg, #E8FAF1 0%, #D9F5E8 100%); }
  .rc-icon.indigo { background: linear-gradient(135deg, #EEF0FF 0%, #E0E5FC 100%); }
  .rc-tx { flex: 1; min-width: 0; }
  .rc-tx .t { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  .rc-tx .s { display: block; margin-top: 2px; font-size: 11px; color: var(--muted); }
  .arrow {
    width: 22px; height: 22px; border-radius: 50%;
    background: #F1F3F8; color: #9AA5B5; font-size: 13px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .divider { height: 1px; background: var(--line); margin: 0 16px; }

  /* 退出登录（弱化：低调文本按钮，置于列表下方） */
  .logout {
    display: block; width: 100%; padding: 14px 0 6px; border: none; background: transparent;
    color: #AAB4C4; font-size: 12.5px; font-weight: 500;
    font-family: inherit; letter-spacing: 1.5px; cursor: pointer;
    text-align: center; transition: color .15s;
  }
  .logout:active { color: var(--red); }

  /* TabBar */
  .tabbar { flex-shrink: 0; padding: 10px 16px 20px; background: var(--bg); position: relative; z-index: 5; }
  .tab-pill {
    background: #fff; border-radius: 38px; height: 66px;
    display: flex; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
    padding: 5px; border: 1px solid rgba(15,77,178,.05);
  }
  .tab {
    flex: 1; border-radius: 30px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; cursor: pointer;
    transition: all .25s; color: #8A94A6; font-size: 10.5px;
  }
  .tab.active {
    background: linear-gradient(135deg, #0A5FD4, #014DB2);
    color: #fff; font-weight: 600;
    box-shadow: 0 6px 14px rgba(1, 77, 178, 0.32);
  }
  .tab svg { display: block; }

  /* toast */
  .toast {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(10, 22, 40, 0.88); color: #fff; font-size: 13px;
    padding: 9px 18px; border-radius: 100px; opacity: 0; pointer-events: none;
    transition: all .3s; white-space: nowrap; z-index: 320;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>
  <div class="page">
    <div class="my-top">
      <div class="statusbar">
        <span class="time">09:52</span>
        <div class="capsule">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      </div>
      <div class="my-head">
        <span class="tt">我的</span>
      </div>

      <!-- 个人信息展示 -->
      <div class="profile-wrap">
        <div class="profile">
          <div class="p-top">
            <div class="p-avatar">
              <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8.1" r="4.3" fill="rgba(255,255,255,.96)"/><path d="M4.4 20a7.6 7.6 0 0115.2 0" fill="rgba(255,255,255,.96)"/></svg>
            </div>
            <div class="p-main">
              <div class="p-name-row">
                <span class="p-name">张三</span>
                <span class="p-status"><i></i>工作中</span>
              </div>
              <div class="p-sub">工号：10086</div>
              <div class="p-tel">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="7" y="2.5" width="10" height="19" rx="2.5" stroke="#8A94A6" stroke-width="1.6"/><rect x="10.2" y="18" width="3.6" height="1.4" rx="0.7" fill="#8A94A6"/></svg>
                138****10086
              </div>
            </div>
          </div>
          <div class="p-meta">
            <div class="mi"><span class="k">当前用车</span><span class="v">苏A·12345</span></div>
            <div class="mi"><span class="k">今日用车记录</span><span class="v">1 次</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="my-body">
      <!-- 我的记录（自首页迁移） -->
      <div class="grp">
        <div class="grp-h"><span class="tick"></span>我的记录<span class="g-note">派单 · 出勤</span></div>
        <div class="row-cell" onclick="location.href='dispatch-records.html'">
          <div class="rc-icon blue">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M5.5 2.75h11a1.8 1.8 0 011.8 1.8v13.9a1.8 1.8 0 01-1.8 1.8h-11a1.8 1.8 0 01-1.8-1.8V4.55a1.8 1.8 0 011.8-1.8z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><rect x="8.25" y="11.9" width="5.5" height="3.7" rx="1" fill="#014DB2"/><rect x="12.8" y="2.75" width="3.7" height="3.7" rx="0.9" stroke="#014DB2" stroke-width="1.4"/></svg>
          </div>
          <span class="rc-tx"><span class="t">派单记录</span><span class="s">查看维护我的派单数据</span></span>
          <span class="arrow">›</span>
        </div>
        <div class="divider"></div>
        <div class="row-cell" onclick="location.href='attendance.html'">
          <div class="rc-icon green">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3.7" y="4.6" width="14.7" height="14.7" rx="2.3" stroke="#10B981" stroke-width="1.6"/><path d="M3.7 9.2h14.7" stroke="#10B981" stroke-width="1.6"/><rect x="7.3" y="12.5" width="3" height="3" rx="0.8" fill="#10B981"/><rect x="11.8" y="12.5" width="3" height="3" rx="0.8" fill="#10B981"/><path d="M7.3 2.8v3.6M14.7 2.8v3.6" stroke="#10B981" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>
          <span class="rc-tx"><span class="t">出勤记录</span><span class="s">每日上班 · 下班两次打卡记录</span></span>
          <span class="arrow">›</span>
        </div>
      </div>

      <!-- 账号与安全 -->
      <div class="grp">
        <div class="grp-h"><span class="tick"></span>账号与安全<span class="g-note">登录 · 密码</span></div>
        <div class="row-cell" onclick="location.href='change-password.html'">
          <div class="rc-icon indigo">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="4.5" y="9.7" width="13" height="8.6" rx="2.4" stroke="#4F46E5" stroke-width="1.6"/><path d="M7.5 9.7V7a3.5 3.5 0 017 0v2.7" stroke="#4F46E5" stroke-width="1.6"/><circle cx="11" cy="13.9" r="1.5" fill="#4F46E5"/></svg>
          </div>
          <span class="rc-tx"><span class="t">修改密码</span><span class="s">验证当前密码后设置新密码</span></span>
          <span class="arrow">›</span>
        </div>
      </div>

      <button class="logout" onclick="logout()">退出登录</button>
    </div>

    <!-- 底部标签栏 -->
    <div class="tabbar">
      <div class="tab-pill">
        <div class="tab" data-tab="0" onclick="goTab(this)">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.5 7.5L9 2l6.5 5.5V15a1 1 0 01-1 1h-4v-5H7.5v5h-4a1 1 0 01-1-1V7.5z" fill="currentColor"/></svg>
          <span>首页</span>
        </div>
        <div class="tab" data-tab="1" onclick="goTab(this)">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2.5 6l4-3h5l4 3v8a1 1 0 01-1 1h-11a1 1 0 01-1-1V6z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="9" cy="10" r="2" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>车辆</span>
        </div>
        <div class="tab" data-tab="2" onclick="goTab(this)">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="3" y="2.5" width="12" height="13" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M6 6.5h6M6 9.5h6M6 12.5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>工作记录</span>
        </div>
        <div class="tab active" data-tab="3" onclick="goTab(this)">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="5.5" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M2.8 15.5a6.2 6.2 0 0112.4 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>我的</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }

  /* 派单/出勤记录：入口占位（列表页后续按数据补充） */
  function comingSoon(name) {
    toast('「' + name + '」功能建设中，敬请期待');
  }

  function logout() {
    location.href = 'index.html';
  }

  function goTab(el) {
    var idx = el.dataset.tab;
    if (idx === '0') { location.href = 'home.html'; return; }
    if (idx === '1') { location.href = 'vehicles.html'; return; }
    if (idx === '2') { location.href = 'trip-records.html'; return; }
    if (idx === '3') return; /* 当前已在「我的」 */
  }
</script>

</body>
</html>
