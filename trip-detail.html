<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 行程详情</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --green-dark: #047857;
    --green-bg: #ECFDF5;
    --amber: #F59E0B;
    --red: #EF4444;
    --red-dark: #B91C1C;
    --red-bg: #FEF2F2;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 24px 12px; color: var(--text); overflow-y: auto;
  }

  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }
  .notch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100; }
  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule { width: 88px; height: 28px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; gap: 5px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  .td-content { flex: 1; position: relative; z-index: 1; display: flex; flex-direction: column; overflow: hidden; }
  .td-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative; border-bottom: 1px solid #EEF0F5;
  }
  .td-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .15s;
  }
  .td-nav .back-btn:active { transform: scale(0.9); }
  .td-nav .title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: 700; }

  .td-body {
    flex: 1; padding: 14px 16px 26px; overflow-y: auto; scrollbar-width: none;
    display: flex; flex-direction: column; gap: 12px;
  }
  .td-body::-webkit-scrollbar { display: none; }

  /* 状态徽章 */
  .st {
    font-size: 10.5px; font-weight: 700; border-radius: 100px; padding: 2.5px 9px;
    border: 1px solid transparent; flex-shrink: 0;
  }
  .st.ok { color: var(--green-dark); background: var(--green-bg); border-color: #A7F3D0; }
  .st.bad { color: var(--red-dark); background: var(--red-bg); border-color: #FECACA; }
  .st.info { color: var(--primary); background: var(--blue-bg); border-color: #D6E6FA; }
  .st.gray { color: var(--sub); background: #F3F4F6; border-color: #E5E7EB; }

  /* 行程概览信息卡 */
  .info-card {
    background: #fff; border-radius: 14px; padding: 14px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
    margin-top: 10px;
  }
  .info-card .plate-line {
    display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
    font-size: 20px; font-weight: 800; letter-spacing: .8px;
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
  }
  .info-card .plate-line .md { font-size: 11.5px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .info-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .info-grid .ic { min-width: 0; }
  .info-grid .ic .k { font-size: 9.5px; color: var(--faint); }
  .info-grid .ic .v { font-size: 13px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info-grid .ic .v.blue { color: var(--primary); }

  /* 时间线 */
  .tl-item { display: flex; gap: 10px; }
  .tl-rail { width: 22px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
  .tl-dot {
    width: 21px; height: 21px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .tl-dot.ok { background: linear-gradient(135deg, #0A5FD4, #014DB2); color: #fff; box-shadow: 0 3px 8px rgba(1,77,178,.25); }
  .tl-dot.bad { background: linear-gradient(135deg, #F87171, #EF4444); color: #fff; box-shadow: 0 3px 8px rgba(239,68,68,.25); }
  .tl-line { flex: 1; width: 2px; background: #E1E7F0; margin: 5px 0; min-height: 18px; }
  .tl-item:last-child .tl-line { display: none; }

  .tl-card {
    flex: 1; min-width: 0; background: #fff; border-radius: 14px;
    padding: 12px 14px; margin-bottom: 4px;
    box-shadow: 0 6px 18px rgba(15, 42, 86, 0.06);
  }
  .tl-head { display: flex; align-items: center; gap: 8px; padding-bottom: 9px; margin-bottom: 9px; border-bottom: 1px solid #F2F4F8; }
  .tl-no {
    width: 22px; height: 22px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, #EFF6FF, #DCECFB); border: 1px solid #D6E6FA;
    color: var(--primary); font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .tl-t { font-size: 14.5px; font-weight: 800; flex: 1; min-width: 0; }
  .tl-time { flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--muted); }

  /* 字段行 */
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 5px 0; }
  .row .k { font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .row .v { font-size: 13px; font-weight: 600; color: var(--text); text-align: right; word-break: break-all; }
  .row .v.num { font-size: 17px; font-weight: 800; color: var(--primary); font-family: Inter, "Sarasa Gothic SC", sans-serif; }
  .row .v.num .u { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-left: 3px; }

  /* 照片占位 */
  .shots { display: flex; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
  .shot {
    width: 54px; height: 54px; border-radius: 10px;
    border: 1.5px dashed #C9D5E6; background: #F6F8FB;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--faint); gap: 2px;
  }
  .shot.done { border-style: solid; border-color: #A7E3C6; background: #F0FDF6; color: var(--green-dark); }
  .shot.bad { border-style: solid; border-color: #FECACA; background: var(--red-bg); color: var(--red-dark); }
  .shot .t { font-size: 8.5px; font-weight: 600; }
  .cap-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .cap-row .k2 { font-size: 11px; color: var(--faint); flex-shrink: 0; }

  /* 环视方位 chips */
  .circles { display: flex; gap: 5px; flex-wrap: wrap; }
  .cc {
    font-size: 10px; font-weight: 600; border-radius: 100px; padding: 3px 8px;
    background: #F0FDF6; color: var(--green-dark); border: 1px solid #A7E3C6;
    display: inline-flex; align-items: center; gap: 3px;
  }
  .cc::before { content: "✓"; font-weight: 800; }
  .cc.bad { background: var(--red-bg); color: var(--red-dark); border-color: #FECACA; }
  .cc.bad::before { content: "!"; font-weight: 800; }

  /* 警示 / 异常面板 */
  .warn-box {
    margin-top: 9px; border-radius: 10px; padding: 9px 11px;
    background: var(--red-bg); border: 1px solid #FECACA;
  }
  .warn-box .wb-t { font-size: 11.5px; font-weight: 800; color: var(--red-dark); display: flex; align-items: center; gap: 5px; }
  .warn-box .wb-d { font-size: 11px; color: #7F1D1D; margin-top: 5px; line-height: 1.6; }
  .diff-warn {
    margin-top: 9px; border-radius: 10px; padding: 8px 11px;
    background: #FFFBEB; border: 1px solid #FDE68A;
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: #B45309; line-height: 1.5;
  }
  .diff-ok {
    margin-top: 9px; border-radius: 10px; padding: 8px 11px;
    background: #F0FDF6; border: 1px solid #A7E3C6;
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; color: var(--green-dark); line-height: 1.5;
  }
  .sec-lab { font-size: 10.5px; color: var(--faint); margin-top: 7px; display: block; }
</style>
</head>

  function shotOk(t) {
    t = t || '已拍摄';
    return '<div class="shot done"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.5"/></svg><span class="t">' + t + '</span></div>';
  }
  function shotBad(n) {
    var h = '';
    for (var i = 0; i < n; i++) {
      h += '<div class="shot bad"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.5"/></svg><span class="t">异常照' + (i + 1) + '</span></div>';
    }
    return h;
  }
  /* 360° 环视检查 6 方位照片（异常方位为 .shot.bad，其余 .shot.done） */
  function surroundShots(abnPos) {
    var cam = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.8-2.4h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" stroke="currentColor" stroke-width="1.5"/></svg>';
    return POS.map(function (p) {
      var bad = !!(abnPos && p === abnPos);
      return '<div class="shot ' + (bad ? 'bad' : 'done') + '">' + cam + '<span class="t">' + p + '</span></div>';
    }).join('');
  }
  function row(k, v) { return '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>'; }
  function numRow(k, v, u) { return '<div class="row"><span class="k">' + k + '</span><span class="v num">' + v + (u ? '<span class="u">' + u + '</span>' : '') + '</span></div>'; }
  function stepHead(no, title, t) {
    return '<div class="tl-head"><span class="tl-no">' + no + '</span><span class="tl-t">' + title + '</span>' +
      (t ? '<span class="tl-time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.6" stroke="currentColor" stroke-width="1.8"/><path d="M12 7.4V12l3.1 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>提交 ' + t + '</span>' : '') +
      '</div>';
  }
  function step(no, title, state, body, t) {
    /* state: 'ok' | 'bad' */
    var dot = state === 'bad'
      ? '<div class="tl-dot bad"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 4.5L21 19.5H3L12 4.5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 10.5v4.2" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>'
      : '<div class="tl-dot ok"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.6 4.6L19 7.6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>';
    return '<div class="tl-item">' +
      '<div class="tl-rail">' + dot + '<span class="tl-line"></span></div>' +
      '<div class="tl-card">' + stepHead(no, title, t) + body + '</div>' +
    '</div>';
  }

  /* ---------- 渲染 ---------- */
  function badgeOf(v) {
    if (v === '正常' || v === '通过' || v === '无') return '<span class="st ok">' + v + '</span>';
    if (v === '异常') return '<span class="st bad">异常</span>';
    return '<span class="st gray">' + v + '</span>';
  }

  function renderTrip(i) {
    var r = TRIPS[i];
    if (!r) { document.getElementById('tlList').innerHTML = '<div style="text-align:center;color:#8A94A6;padding:40px 0;font-size:13px">未找到该行程</div>'; return; }

    /* 异常档案模式（src=abn）：只展示 车辆检查 / 异常上报 / 结束里程 中存在异常的步骤；某一步无异常则不显示该步 */
    var _no = 0;
    function nxt() { return ++_no; }
    function showStep(n) {
      if (!isAbn) return true;                     /* 常规行程详情：完整 7 步时间线 */
      if (n === 3) return r.check === '异常';      /* 车辆检查：仅当 360°环视 / 重点检查项 有异常时展示 */
      if (n === 5) return r.exception === '异常';  /* 异常上报：仅当使用过程上报异常时展示 */
      if (n === 7) return r.returnCheck === '异常';/* 结束里程：仅当还车检查异常时展示 */
      return false;
    }

    var diff = r.sKm - r.lastKm;
    var diffHtml = diff > 50
      ? '<div class="diff-warn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M12 4.5L21 19.5H3L12 4.5z" stroke="#F59E0B" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/></svg>本次起始里程与上次行程结束里程差额 ' + fmt(diff) + ' km（超过 50km），已预警确认</div>'
      : '<div class="diff-ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="8.5" stroke="#10B981" stroke-width="1.8"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>差额 ' + fmt(diff) + ' km，与上次行程结束里程核对无误</div>';

    /* 行程概览信息卡 */
    document.getElementById('infoCard').innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">' +
        '<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--text);">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5" width="17" height="16" rx="2.5" stroke="#014DB2" stroke-width="1.8"/><path d="M3.5 9.5h17M8 3v4M16 3v4" stroke="#014DB2" stroke-width="1.8" stroke-linecap="round"/></svg>' +
          r.dM + '<span style="font-size:11.5px;font-weight:500;color:var(--muted);margin-left:2px;">' + r.weak + '</span>' +
        '</div>' +
        (r.flag ? '<span class="st info">' + r.flag + '</span>' : '') +
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">' +
          '<span style="font-size:10px;font-weight:700;color:#0A1628;background:#F1F3F8;border-radius:100px;padding:2.5px 9px;font-family:Inter,sans-serif;letter-spacing:.4px;">' + r.no + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="plate-line">' + r.plate + '<span class="md">' + r.model + '</span></div>' +
      '<div class="info-grid">' +
        '<div class="ic"><div class="k">开始用车</div><div class="v">' + r.start + '</div></div>' +
        '<div class="ic"><div class="k">结束用车</div><div class="v">' + r.end + '</div></div>' +
        '<div class="ic"><div class="k">本次驾驶员</div><div class="v">' + r.driver + '</div></div>' +
        '<div class="ic"><div class="k">本次里程</div><div class="v blue">' + fmt(r.eKm - r.sKm) + ' km</div></div>' +
      '</div>';

    /* 7 步时间线 */
    var h = '';

    /* 1 开始用车 */
    if (showStep(1)) h += step(nxt(), '开始用车', 'ok',
      row('开始用车时间', r.start) +
      row('驾驶员', r.driver + ' · 工号 ' + r.emp) +
      row('打卡定位', ADDR) +
      row('定位结果', badgeOf('与后台打卡点一致')) +
      '<span class="sec-lab">现场照片（后置相机）</span><div class="shots">' + shotOk('现场') + '</div>',
      r.start);

    /* 2 选择车辆 */
    var carImg = 'img/car-camry.png';
    if (r.model.indexOf('迈腾') >= 0) carImg = 'img/car-magotan.png';
    else if (r.model.indexOf('奥迪') >= 0) carImg = 'img/car-audi.png';
    else if (r.model.indexOf('GL8') >= 0) carImg = 'img/car-gl8.png';
    if (showStep(2)) h += step(nxt(), '选择车辆', 'ok',
      '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">' +
        '<img src="' + carImg + '" style="width:86px;height:64px;border-radius:10px;object-fit:cover;background:#F0F2F7;">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:15px;font-weight:800;margin-bottom:3px;">' + r.plate + '</div>' +
          '<div style="font-size:11px;color:var(--muted);line-height:1.35;">' + r.model + '<br>' + r.color + '</div>' +
        '</div>' +
      '</div>' +
      row('上一位使用驾驶员', r.lastDriver),
      r.selAt);

    /* 3 车辆检查（接车）：异常来源 = 360°环视检查 或 重点检查项目 */
    var cirAbn = !!(r.chkExPos);      /* 360°环视存在异常方位 */
    var itemAbn = !!(r.chkItemName);  /* 重点检查项目存在异常项 */
    var chkBad = cirAbn || itemAbn;
    var circles = POS.map(function (p) { return chip(p, cirAbn && p === r.chkExPos); }).join('');
    var chkBody =
      row('检查时间', r.chkAt) +
      '<span class="sec-lab">车辆 360° 环视检查（6 方位）</span>' +
      '<div class="circles" style="margin-top:7px">' + circles + '</div>' +
      '<div class="row" style="margin-top:2px"><span class="k" style="font-size:11px">环视检查结果</span>' +
        (cirAbn ? '<span class="st bad">存在异常</span>' : '<span class="st ok">全部正常</span>') + '</div>' +
      '<span class="sec-lab" style="margin-top:6px">环视照片（6 张 · 一方位一帧）</span>' +
      '<div class="shots">' + surroundShots(r.chkExPos) + '</div>';
    if (cirAbn) {
      chkBody += '<div class="warn-box">' +
        '<div class="wb-t"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 4.5L21 19.5H3L12 4.5z" stroke="#EF4444" stroke-width="2" stroke-linejoin="round"/><path d="M12 10.5v4.2" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></svg>360° 环视检查异常</div>' +
        row('异常方位', '<span style="color:#B91C1C;font-weight:800">' + r.chkExPos + '</span>') +
        row('异常分类', r.chkExCat) +
        '<span class="sec-lab" style="margin-top:4px">异常照片</span><div class="shots">' + shotBad(r.chkExPhotos) + '</div>' +
        '<div class="wb-d">' + r.chkExDesc + '</div>' +
      '</div>';
    }
    chkBody += '<span class="sec-lab">重点检查项目（' + MAJOR + '）</span>' +
      '<div class="row" style="margin-top:2px"><span class="k" style="font-size:11px">检查结果</span>' +
        (itemAbn ? '<span class="st bad">存在异常</span>' : '<span class="st ok">全部正常</span>') + '</div>';
    if (itemAbn) {
      chkBody += '<div class="warn-box">' +
        '<div class="wb-t"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 4.5L21 19.5H3L12 4.5z" stroke="#EF4444" stroke-width="2" stroke-linejoin="round"/><path d="M12 10.5v4.2" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></svg>重点检查项目异常</div>' +
        row('异常项目', '<span style="color:#B91C1C;font-weight:800">' + (r.chkItemGrp ? r.chkItemGrp + ' · ' : '') + r.chkItemName + '</span>') +
        row('异常分类', r.chkItemCat) +
        '<span class="sec-lab" style="margin-top:4px">异常照片</span><div class="shots">' + shotBad(r.chkItemPhotos) + '</div>' +
        '<div class="wb-d">' + r.chkItemDesc + '</div>' +
      '</div>';
    }
    if (showStep(3)) h += step(nxt(), '车辆检查', chkBad ? 'bad' : 'ok',
      '<div class="row"><span class="k">接车检查结果</span>' + (chkBad ? '<span class="st bad">异常</span>' : '<span class="st ok">正常</span>') + '</div>' +
      chkBody,
      r.chkAt);

    /* 4 起始里程 */
    if (showStep(4)) h += step(nxt(), '起始里程', 'ok',
      '<span class="sec-lab">仪表盘照片（强制相机拍摄）</span><div class="shots">' + shotOk() + '</div>' +
      numRow('本次起始里程', fmt(r.sKm), 'km') +
      row('上次本车行程结束里程', fmt(r.lastKm) + ' km') +
      diffHtml,
      r.mtrAt);

    /* 5 异常上报 */
    var excBad = r.exception === '异常';
    var excBody;
    if (excBad) {
      excBody =
        row('异常类型', '<span class="st bad">' + r.excType + '</span>') +
        row('上报时间', r.excAt) +
        '<span class="sec-lab">异常照片（' + r.excPhotos + ' 张）</span><div class="shots">' + shotBad(r.excPhotos) + '</div>' +
        '<span class="sec-lab" style="margin-top:6px">异常说明</span>' +
        '<div class="warn-box"><div class="wb-d" style="margin-top:0">' + r.excDesc + '</div></div>';
    } else {
      excBody =
        row('异常类型', '<span class="st ok">无</span>') +
        '<div class="diff-ok"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><circle cx="12" cy="12" r="8.5" stroke="#10B981" stroke-width="1.8"/><path d="M8.5 12.2l2.4 2.4 4.6-5" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>本次行程使用过程无异常情况</div>';
    }
    if (showStep(5)) h += step(nxt(), '异常上报', excBad ? 'bad' : 'ok', excBody, r.excAt);

    /* 6 结束用车 */
    if (showStep(6)) h += step(nxt(), '结束用车', 'ok',
      row('结束用车时间', r.end) +
      row('驾驶员', r.driver + ' · 工号 ' + r.emp) +
      row('打卡定位', ADDR) +
      row('定位结果', badgeOf('与后台打卡点一致')) +
      '<span class="sec-lab">现场照片（后置相机）</span><div class="shots">' + shotOk('现场') + '</div>',
      r.end);

    /* 7 结束里程（还车）：还车检查 = 360° 环视检查异常 */
    var rtBad = !!(r.rtExPos);
    var rcircles = POS.map(function (p) { return chip(p, rtBad && p === r.rtExPos); }).join('');
    var rtBody =
      '<span class="sec-lab">仪表盘照片（强制相机拍摄）</span><div class="shots">' + shotOk() + '</div>' +
      numRow('本次结束里程', fmt(r.eKm), 'km') +
      numRow('本次用车里程', fmt(r.eKm - r.sKm), 'km') +
      '<span class="sec-lab">还车 360° 环视检查（6 方位）</span>' +
      '<div class="circles" style="margin-top:7px">' + rcircles + '</div>' +
      '<div class="row" style="margin-top:2px"><span class="k">还车检查结果</span>' + (rtBad ? '<span class="st bad">异常</span>' : '<span class="st ok">正常</span>') + '</div>' +
      '<span class="sec-lab" style="margin-top:6px">还车环视照片（6 张 · 一方位一帧）</span>' +
      '<div class="shots">' + surroundShots(r.rtExPos) + '</div>';
    if (rtBad) {
      rtBody += '<div class="warn-box">' +
        '<div class="wb-t"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 4.5L21 19.5H3L12 4.5z" stroke="#EF4444" stroke-width="2" stroke-linejoin="round"/><path d="M12 10.5v4.2" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/></svg>还车 360° 环视检查异常</div>' +
        row('异常方位', '<span style="color:#B91C1C;font-weight:800">' + r.rtExPos + '</span>') +
        row('异常分类', r.rtExCat) +
        '<span class="sec-lab" style="margin-top:4px">异常照片</span><div class="shots">' + shotBad(r.rtExPhotos || 1) + '</div>' +
        '<div class="wb-d">' + r.rtExDesc + '</div>' +
      '</div>';
    }
    if (showStep(7)) h += step(nxt(), '结束里程', rtBad ? 'bad' : 'ok', rtBody, r.rtAt);

    document.getElementById('tlList').innerHTML = h;
  }

  /* ---------- 入口 ---------- */
  var id = parseInt((location.search.match(/id=(\d+)/) || [])[1] || '0', 10);
  var isAbn = (location.search.match(/[?&]src=([^&]*)/) || [])[1] === 'abn';
  document.getElementById('navTitle').textContent = isAbn ? '异常档案' : '行程详情';
  document.title = '公务用车驾驶员端 · ' + (isAbn ? '异常档案' : '行程详情');
  renderTrip(id);

  /* 返回：从车辆异常档案(?src=abn)进入 → 回异常档案；从车辆使用日志(?plate=)进入 → 回该车日志；从工作记录进入 → 回工作记录列表 */
  function backUrl() {
    var m = location.search.match(/[?&]plate=([^&]*)/);
    var src = (location.search.match(/[?&]src=([^&]*)/) || [])[1];
    if (src === 'abn') return m ? 'vehicle-abn.html?plate=' + m[1] : 'vehicle-abn.html';
    return m ? 'trip-log.html?plate=' + m[1] : 'trip-records.html';
  }
</script>
</body>
</html>
