<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公务用车驾驶员端 · 当前用车信息</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #014DB2;
    --primary-2: #0A5FD4;
    --text: #0A1628;
    --sub: #6B7280;
    --muted: #8A94A6;
    --faint: #9AA5B5;
    --green: #10B981;
    --amber: #F59E0B;
    --bg: #F7F8FA;
    --card: #FFFFFF;
    --line: #EEF0F5;
    --blue-bg: #EFF6FF;
  }

  html { height: 100%; }
  body {
    min-height: 100%;
    font-family: "Sarasa Gothic SC", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: linear-gradient(135deg, #E8EEF8 0%, #D7E2F2 50%, #C9D8EC 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 24px 12px;
    color: var(--text);
    overflow-y: auto;
  }

  /* 手机外框 */
  .phone {
    width: 375px; max-width: 100%; height: 812px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow: 0 30px 80px rgba(1, 77, 178, 0.28), 0 0 0 10px #1c1c1e, 0 0 0 12px #3a3a3c;
    position: relative; overflow: hidden;
  }

  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 120px; height: 30px; background: #1c1c1e; border-radius: 18px; z-index: 100;
  }

  .page { position: absolute; inset: 0; display: flex; flex-direction: column; }

  /* 状态栏 */
  .statusbar {
    height: 62px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; z-index: 50;
  }
  .statusbar .time { font-size: 15px; font-weight: 600; font-family: Inter, sans-serif; }
  .capsule {
    width: 88px; height: 28px; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .capsule .dot { width: 5px; height: 5px; border-radius: 50%; }
  .capsule .dot:nth-child(1) { background: #0A1628; }
  .capsule .dot:nth-child(2) { background: #9CA3AF; }
  .capsule .dot:nth-child(3) { background: #E3E7EB; }

  /* 内容 */
  .ws-content {
    flex: 1; position: relative; z-index: 1;
    display: flex; flex-direction: column;
    overflow-y: auto; scrollbar-width: none;
  }
  .ws-content::-webkit-scrollbar { display: none; }
  .ws-nav {
    height: 48px; flex-shrink: 0; display: flex; align-items: center;
    padding: 0 12px; position: relative;
    border-bottom: 1px solid #EEF0F5;
  }
  .ws-nav .back-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: #F0F2F7; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s;
  }
  .ws-nav .back-btn:active { transform: scale(0.9); }
  .ws-nav .title {
    position: absolute; left: 50%; transform: translateX(-50%);
    font-size: 16px; font-weight: 700;
  }
  .ws-body { flex: 1; padding: 14px 16px 24px; display: flex; flex-direction: column; gap: 14px; }

  /* 日期信息头 */
  .date-card {
    background: linear-gradient(135deg, #0A5FD4 0%, #014DB2 55%, #001645 100%);
    border-radius: 16px; padding: 16px;
    color: #fff; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    box-shadow: 0 10px 24px rgba(1, 77, 178, 0.24);
  }
  .date-card::after {
    content: ''; position: absolute; right: -40px; top: -52px;
    width: 150px; height: 150px; border-radius: 50%;
    border: 20px solid rgba(255,255,255,.05);
    pointer-events: none;
  }
  .date-left { display: flex; flex-direction: column; gap: 4px; z-index: 1; }
  .date-left .d { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .date-left .w { font-size: 12px; color: rgba(255,255,255,.72); }
  .date-right {
    z-index: 1; display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.16); border-radius: 100px;
    padding: 5px 12px; font-size: 12px; font-weight: 500;
    border: 1px solid rgba(255,255,255,.14);
  }
  .date-right .pdot {
    width: 6px; height: 6px; border-radius: 50%; background: #34D399;
    box-shadow: 0 0 0 3px rgba(52,211,153,.3);
  }

  /* 字段卡片 */
  .field-card {
    background: var(--card); border-radius: 14px; padding: 6px 14px;
    box-shadow: 0 4px 16px rgba(15, 77, 178, 0.06);
    border: 1px solid rgba(15,77,178,.04);
  }
  .field-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 0;
  }
  .field-row + .field-row { border-top: 1px solid var(--line); }
  .field-row .ficon {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #EAF3FF 0%, #DCE9FC 100%);
  }
  .field-row .fname { flex: 1; font-size: 14.5px; color: var(--text); font-weight: 500; }
  .field-row .fval {
    font-size: 15px; font-weight: 700; color: var(--text);
    font-family: Inter, "Sarasa Gothic SC", sans-serif;
  }
  .field-row .fval.green { color: var(--green); }
  .field-row .fval.amber { color: var(--amber); }
  .field-row .fval.dim { color: var(--muted); font-weight: 600; }
</style>
</head>
<body>

<div class="phone">
  <div class="notch"></div>

  <div class="page" id="page-ws">
    <div class="statusbar">
      <span class="time">9:41</span>
      <div class="capsule"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>

    <div class="ws-content">
      <div class="ws-nav">
        <button class="back-btn" onclick="location.href='home.html'">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3.5L5.5 9l5.5 5.5" stroke="#014DB2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="title">当前用车信息</span>
      </div>

      <div class="ws-body">
        <div class="date-card">
          <div class="date-left">
            <span class="d">2026年9月2日</span>
            <span class="w">星期三 · 当前用车信息</span>
          </div>
          <span class="date-right"><span class="pdot"></span>工作中</span>
        </div>

        <div class="field-card">
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="#014DB2" stroke-width="1.6"/><path d="M10 6.2V10l2.6 1.8" stroke="#014DB2" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <span class="fname">开始用车时间</span>
            <span class="fval">08:15</span>
          </div>
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="2.5" stroke="#014DB2" stroke-width="1.6"/><path d="M6.2 10l2.6 2.6 5-5" stroke="#014DB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="fname">车辆检查</span>
            <span class="fval green">已完成</span>
          </div>
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="#014DB2" stroke-width="1.6"/><path d="M10 5v5l3 2" stroke="#014DB2" stroke-width="1.6" stroke-linecap="round"/></svg>
            </div>
            <span class="fname">起始公里数</span>
            <span class="fval">12580 km</span>
          </div>
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 10c3.5-1 5.5-3 7-6 1.5 3 3.5 5 7 6" stroke="#014DB2" stroke-width="1.6" stroke-linecap="round"/><path d="M3 14c3.5-1 5.5-3 7-6 1.5 3 3.5 5 7 6" stroke="#014DB2" stroke-width="1.6" stroke-linecap="round" opacity=".45"/></svg>
            </div>
            <span class="fname">本次用车里程</span>
            <span class="fval">0 km</span>
          </div>
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3.5l7 12H3l7-12z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/><rect x="9.1" y="8.4" width="1.8" height="4" rx="0.9" fill="#014DB2"/><circle cx="10" cy="14.2" r="1.2" fill="#014DB2"/></svg>
            </div>
            <span class="fname">异常上报</span>
            <span class="fval green">无</span>
          </div>
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="#014DB2" stroke-width="1.6"/><path d="M6.4 10.3l2.5 2.5 4.7-5.2" stroke="#014DB2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <span class="fname">结束用车时间</span>
            <span class="fval">19:30</span>
          </div>
          <div class="field-row">
            <div class="ficon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 3.5h10l-2 5 2 5H5l2-5-2-5z" stroke="#014DB2" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </div>
            <span class="fname">结束里程</span>
            <span class="fval dim">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
